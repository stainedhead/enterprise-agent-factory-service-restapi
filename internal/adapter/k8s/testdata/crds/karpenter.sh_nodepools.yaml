# Minimal envtest stand-in for Karpenter v1.0 (karpenter.sh/v1).
# Pinned by group, version and kind only: the schema accepts any fields so the reconciler's rendered
# objects can be applied and read back; it does not reproduce the vendor's validation. Real
# validation runs in the e2e suite against the dev cluster (N-9).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.karpenter.sh
spec:
  group: karpenter.sh
  scope: Cluster
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    singular: nodepool
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
