# Minimal envtest stand-in for external-snapshotter v8 (snapshot.storage.k8s.io/v1).
# Pinned by group, version and kind only: the schema accepts any fields so the reconciler's rendered
# objects can be applied and read back; it does not reproduce the vendor's validation. Real
# validation runs in the e2e suite against the dev cluster (N-9).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes-csi/external-snapshotter/pull/419"
  name: volumesnapshotcontents.snapshot.storage.k8s.io
spec:
  group: snapshot.storage.k8s.io
  scope: Cluster
  names:
    kind: VolumeSnapshotContent
    listKind: VolumeSnapshotContentList
    plural: volumesnapshotcontents
    singular: volumesnapshotcontent
    shortNames: [vsc]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
