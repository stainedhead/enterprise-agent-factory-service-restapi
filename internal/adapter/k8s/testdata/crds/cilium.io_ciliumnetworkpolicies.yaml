# Minimal envtest stand-in for Cilium v1.16 (cilium.io/v2).
# Pinned by group, version and kind only: the schema accepts any fields so the reconciler's rendered
# objects can be applied and read back; it does not reproduce the vendor's validation. Real
# validation runs in the e2e suite against the dev cluster (N-9).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
spec:
  group: cilium.io
  scope: Namespaced
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
    shortNames: [cnp]
  versions:
    - name: v2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
