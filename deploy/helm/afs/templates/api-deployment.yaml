{{- $name := "api" }}
{{- $c := include "afs.component" (dict "root" $ "name" $name) | fromYaml }}
{{- if $c.enabled }}
{{- $ctx := dict "root" $ "name" $name "c" $c }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afs-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "afs.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "afs.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        {{- include "afs.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $c.serviceAccount.name }}
      {{- with .Values.global.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "afs.podSecurityContext" $ | nindent 8 }}
      {{- include "afs.spread" $ctx | nindent 6 }}
      containers:
        - name: afs-api
          image: {{ include "afs.image" $ctx | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ $c.ports.http }}}
            - {name: metrics, containerPort: {{ $c.ports.metrics }}}
          env:
            {{- include "afs.env" $ctx | nindent 12 }}
            {{- with .Values.global.cluster.endpoint }}
            - name: AFS_CLUSTER_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.global.cluster.caData }}
            - name: AFS_CLUSTER_CA_DATA
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.global.cluster.oidcIssuer }}
            - name: AFS_CLUSTER_OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            - name: AFS_API_REPLICAS
              value: {{ default $c.replicas $c.rateLimitReplicas | quote }}
            # Both keys must be identical on every replica, so they come from one Secret, never a value.
            - name: AFS_PAGE_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $c.keysSecret.name }}
                  key: pageTokenKey
            - name: AFS_IDEMPOTENCY_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $c.keysSecret.name }}
                  key: idempotencyHmacKey
            {{- if $c.migrate.ownerUser }}
            - name: AFS_DATABASE_OWNER_URL
              value: {{ include "afs.databaseURL" (dict "root" $ "user" $c.migrate.ownerUser) | quote }}
            {{- end }}
          {{- include "afs.probes" $ | nindent 10 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- include "afs.containerSecurityContext" $ | nindent 12 }}
{{- end }}
