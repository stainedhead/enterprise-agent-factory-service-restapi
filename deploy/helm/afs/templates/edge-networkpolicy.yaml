{{- /* afs-edge is the only pod an outside caller reaches. It accepts the ALB on its HTTPS port and Prometheus on the
       metrics port, and it reaches DNS, the database, the identity providers and AWS (443), and the collaboration
       pod of each team (3100) and nothing else. */}}
{{- $name := "edge" }}
{{- $c := include "afs.component" (dict "root" $ "name" $name) | fromYaml }}
{{- if $c.enabled }}
{{- $ctx := dict "root" $ "name" $name "c" $c }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: afs-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "afs.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "afs.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: {{ $c.ports.https }}, protocol: TCP}
      {{- with $c.network.albCidrs }}
      from:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      {{- end }}
    - ports:
        - {port: {{ $c.ports.metrics }}, protocol: TCP}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $c.network.monitoringNamespace }}
    {{- with $c.network.albCidrs }}
    # The ALB's health check reads /readyz on the operations port, from its own subnets only.
    - ports:
        - {port: {{ $c.ports.metrics }}, protocol: TCP}
      from:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
    {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - ports:
        - {port: 5432, protocol: TCP}
      {{- with $c.network.databaseCidrs }}
      to:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      {{- end }}
    - ports:
        - {port: 443, protocol: TCP}
    - ports:
        - {port: 3100, protocol: TCP}
      to:
        - namespaceSelector:
            matchLabels:
              afs.stainedhead.io/team-namespace: "true"
{{- end }}
