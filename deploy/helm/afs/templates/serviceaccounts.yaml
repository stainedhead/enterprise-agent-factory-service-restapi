{{- /* One ServiceAccount per binary. EKS Pod Identity associations (deploy/terraform) bind each to
       its IAM role by namespace and name; no annotation is needed. */}}
{{- range $name := list "api" "reconciler" "gateway" "billing" "edge" }}
{{- $c := include "afs.component" (dict "root" $ "name" $name) | fromYaml }}
{{- if $c.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.serviceAccount.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "afs.labels" (dict "root" $ "name" $name) | nindent 4 }}
{{- end }}
{{- end }}
