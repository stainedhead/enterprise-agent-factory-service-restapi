{{- if .Values.serviceMonitor.enabled }}
{{- range $name := list "api" "gateway" "reconciler" }}
{{- $c := include "afs.component" (dict "root" $ "name" $name) | fromYaml }}
{{- if $c.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "afs.name" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "afs.labels" (dict "root" $ "name" $name) | nindent 4 }}
    {{- with $.Values.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels:
      {{- include "afs.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $.Values.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
