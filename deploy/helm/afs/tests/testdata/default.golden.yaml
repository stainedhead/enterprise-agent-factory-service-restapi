        app.kubernetes.io/name: afs-api
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-1.0.1
    name: afs-api
    namespace: afs-system
spec:
    replicas: 3
    selector:
        matchLabels:
            app.kubernetes.io/instance: afs
            app.kubernetes.io/name: afs-api
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        type: RollingUpdate
    template:
        metadata:
            labels:
                app.kubernetes.io/component: api
                app.kubernetes.io/instance: afs
                app.kubernetes.io/managed-by: Helm
                app.kubernetes.io/name: afs-api
                app.kubernetes.io/part-of: afs
                helm.sh/chart: afs-1.0.1
        spec:
            containers:
                - env:
                    - name: AFS_DATABASE_URL
                      value: postgres://afs_app@afs.cluster-abc123.us-east-1.rds.amazonaws.com:5432/afs?sslmode=verify-full
                    - name: AFS_DB_IAM_AUTH
                      value: "true"
                    - name: AFS_AWS_REGION
                      value: us-east-1
                    - name: AFS_CLUSTER_NAME
                      value: afs-dev
                    - name: AFS_LOG_LEVEL
                      value: info
                    - name: AFS_OTLP_ENDPOINT
                      value: http://otel-collector.observability:4318
                    - name: AFS_API_ADDR
                      value: :8080
                    - name: AFS_METRICS_ADDR
                      value: :9090
                    - name: AFS_API_REPLICAS
                      value: "3"
                    - name: AFS_PAGE_TOKEN_KEY
                      valueFrom:
                        secretKeyRef:
                            key: pageTokenKey
                            name: afs-api-keys
                    - name: AFS_IDEMPOTENCY_HMAC_KEY
                      valueFrom:
                        secretKeyRef:
                            key: idempotencyHmacKey
                            name: afs-api-keys
                  image: 111122223333.dkr.ecr.us-east-1.amazonaws.com/afs/afs-api:v1.0.1
                  imagePullPolicy: IfNotPresent
                  livenessProbe:
                    failureThreshold: 3
                    httpGet:
                        path: /healthz
                        port: metrics
                    periodSeconds: 10
                  name: afs-api
                  ports:
                    - containerPort: 8080
                      name: http
                    - containerPort: 9090
                      name: metrics
                  readinessProbe:
                    failureThreshold: 2
                    httpGet:
                        path: /readyz
                        port: metrics
                    periodSeconds: 5
                  resources:
                    limits:
                        memory: 512Mi
                    requests:
                        cpu: 250m
                        memory: 256Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    readOnlyRootFilesystem: true
                  startupProbe:
                    failureThreshold: 30
                    httpGet:
                        path: /healthz
                        port: metrics
                    periodSeconds: 2
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            serviceAccountName: afs-api
            topologySpreadConstraints:
                - labelSelector:
                    matchLabels:
                        app.kubernetes.io/instance: afs
                        app.kubernetes.io/name: afs-api
                  maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: DoNotSchedule
                - labelSelector:
                    matchLabels:
                        app.kubernetes.io/instance: afs
                        app.kubernetes.io/name: afs-api
                  maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
