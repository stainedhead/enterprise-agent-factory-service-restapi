apiVersion: v1
data:
    afs-slis.json: |-
        {
          "uid": "afs-slis",
          "title": "AFS service levels",
          "tags": [
            "afs"
          ],
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "time": {
            "from": "now-6h",
            "to": "now"
          },
          "refresh": "1m",
          "templating": {
            "list": [
              {
                "name": "datasource",
                "type": "datasource",
                "query": "prometheus",
                "label": "Data source"
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "API request rate by route",
              "description": "RED: rate",
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (route) (rate(afs_api_requests_total[5m]))",
                  "legendFormat": "{{route}}"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "API errors (5xx ratio)",
              "description": "RED: errors. Availability target 99.9%",
              "gridPos": {
                "x": 12,
                "y": 0,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(afs_api_requests_total{code=~\"5..\"}[5m])) / sum(rate(afs_api_requests_total[5m]))",
                  "legendFormat": "5xx ratio"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "API p50 / p99 latency",
              "description": "RED: duration. Read target p99 < 300 ms, reports < 1 s",
              "gridPos": {
                "x": 0,
                "y": 8,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.5, sum by (le) (rate(afs_api_request_duration_seconds_bucket[5m])))",
                  "legendFormat": "p50"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(afs_api_request_duration_seconds_bucket[5m])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "API p99 by route (top 10)",
              "description": "",
              "gridPos": {
                "x": 12,
                "y": 8,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "topk(10, histogram_quantile(0.99, sum by (le, route) (rate(afs_api_request_duration_seconds_bucket[5m]))))",
                  "legendFormat": "{{route}}"
                }
              ]
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Reconcile lag p50 / p95",
              "description": "Target p95 < 60 s",
              "gridPos": {
                "x": 0,
                "y": 16,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.5, sum by (le) (rate(afs_reconcile_lag_seconds_bucket[10m])))",
                  "legendFormat": "p50"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(afs_reconcile_lag_seconds_bucket[10m])))",
                  "legendFormat": "p95"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Reconcile errors and drift corrections",
              "description": "",
              "gridPos": {
                "x": 12,
                "y": 16,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (kind) (rate(afs_reconcile_errors_total[10m]))",
                  "legendFormat": "errors {{kind}}"
                },
                {
                  "refId": "B",
                  "expr": "sum(increase(afs_drift_corrected_total[1h]))",
                  "legendFormat": "drift per hour"
                }
              ]
            },
            {
              "id": 7,
              "type": "stat",
              "title": "Reconciler leader",
              "description": "Exactly one",
              "gridPos": {
                "x": 0,
                "y": 24,
                "w": 6,
                "h": 4
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(afs_reconciler_is_leader)",
                  "legendFormat": "leaders"
                }
              ]
            },
            {
              "id": 8,
              "type": "timeseries",
              "title": "Gateway added latency p99",
              "description": "Target < 25 ms excluding Bedrock time",
              "gridPos": {
                "x": 6,
                "y": 24,
                "w": 9,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(afs_gateway_added_latency_seconds_bucket[5m])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 9,
              "type": "timeseries",
              "title": "Gateway reservation failures and expired reservations",
              "description": "",
              "gridPos": {
                "x": 15,
                "y": 24,
                "w": 9,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (reason) (increase(afs_gateway_reservation_failures_total[5m]))",
                  "legendFormat": "failed {{reason}}"
                },
                {
                  "refId": "B",
                  "expr": "sum(increase(afs_gateway_reservations_expired_total[1h]))",
                  "legendFormat": "expired per hour"
                }
              ]
            },
            {
              "id": 10,
              "type": "timeseries",
              "title": "Outbox backlog and oldest event age",
              "description": "",
              "gridPos": {
                "x": 0,
                "y": 32,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(afs_outbox_pending_events)",
                  "legendFormat": "pending"
                },
                {
                  "refId": "B",
                  "expr": "max(afs_outbox_oldest_age_seconds)",
                  "legendFormat": "oldest age (s)"
                }
              ]
            },
            {
              "id": 11,
              "type": "timeseries",
              "title": "Outbox publish failures and notification failures",
              "description": "",
              "gridPos": {
                "x": 12,
                "y": 32,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(afs_outbox_publish_failures_total[10m]))",
                  "legendFormat": "publish failures/s"
                },
                {
                  "refId": "B",
                  "expr": "sum by (channel_type) (increase(afs_notification_failures_total[1h]))",
                  "legendFormat": "notifications {{channel_type}}"
                }
              ]
            },
            {
              "id": 12,
              "type": "stat",
              "title": "CUR variance (latest day)",
              "description": "Gateway estimate vs billed",
              "gridPos": {
                "x": 0,
                "y": 40,
                "w": 12,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(afs_cost_cur_variance_ratio)",
                  "legendFormat": "variance"
                }
              ]
            },
            {
              "id": 13,
              "type": "timeseries",
              "title": "Gateway settle failures and dropped usage rows",
              "description": "Settlements that fell back to the retry queue, and usage rows lost, by reason",
              "gridPos": {
                "x": 12,
                "y": 40,
                "w": 12,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(increase(afs_gateway_settle_failures_total[5m]))",
                  "legendFormat": "settle failures"
                },
                {
                  "refId": "B",
                  "expr": "sum by (reason) (increase(afs_gateway_usage_rows_dropped_total[5m]))",
                  "legendFormat": "dropped rows: {{reason}}"
                }
              ]
            }
          ]
        }
kind: ConfigMap
metadata:
    labels:
        app.kubernetes.io/component: dashboards
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-dashboards
        app.kubernetes.io/part-of: afs
        grafana_dashboard: "1"
        helm.sh/chart: afs-1.0.1
    name: afs-dashboards
    namespace: afs-system
---
apiVersion: v1
data:
    edge-routing.conf: |
        [FILTER]
            Name          parser
            Match         kube.*_afs-system_afs-edge-*
            Key_Name      log
            Parser        json
            Reserve_Data  On
        [FILTER]
            Name          rewrite_tag
            Match         kube.*_afs-system_afs-edge-*
            Rule          $afs.team_id ^(team_[0-9A-Za-z]+)$ team.$1 false
            Emitter_Name  afs_edge_by_team
        # Lines without a team id (the apex callback) stay with the platform's own log group.
kind: ConfigMap
metadata:
    labels:
        afs.stainedhead.io/log-routing: "true"
        app.kubernetes.io/component: edge
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-edge
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-1.0.1
    name: afs-edge-log-routing
    namespace: afs-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
    labels:
        afs.io/billing-job: cost-tags
        app.kubernetes.io/component: billing
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-billing
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-1.0.1
    name: afs-billing-cost-tags
    namespace: afs-system
spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 5
    jobTemplate:
        spec:
            activeDeadlineSeconds: 3600
            backoffLimit: 2
            template:
                metadata:
                    labels:
                        app.kubernetes.io/component: billing
                        app.kubernetes.io/instance: afs
                        app.kubernetes.io/managed-by: Helm
                        app.kubernetes.io/name: afs-billing
                        app.kubernetes.io/part-of: afs
                        helm.sh/chart: afs-1.0.1
                spec:
                    containers:
                        - args:
                            - --job
                            - cost-tags
                          env:
                            - name: AFS_DATABASE_URL
                              value: postgres://afs_billing@afs.cluster-abc123.us-east-1.rds.amazonaws.com:5432/afs?sslmode=verify-full
                            - name: AFS_DB_IAM_AUTH
                              value: "true"
                            - name: AFS_AWS_REGION
                              value: us-east-1
                            - name: AFS_CLUSTER_NAME
                              value: afs-dev
                            - name: AFS_LOG_LEVEL
                              value: info
                            - name: AFS_OTLP_ENDPOINT
                              value: http://otel-collector.observability:4318
                            - name: AFS_ATHENA_OUTPUT
                              value: s3://afs-athena-results-111122223333/
                            - name: AFS_ATHENA_WORKGROUP
                              value: afs
                            - name: AFS_CUR_DATABASE
                              value: cur
                            - name: AFS_CUR_TABLE
                              value: afs_cur
                            - name: AFS_METRICS_ADDR
