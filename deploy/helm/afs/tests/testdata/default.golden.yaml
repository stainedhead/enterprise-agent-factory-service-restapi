---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-gateway
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-0.1.0
    name: afs-gateway
    namespace: afs-system
spec:
    dnsNames:
        - afs-gateway
        - afs-gateway.afs-system
        - afs-gateway.afs-system.svc
        - afs-gateway.afs-system.svc.cluster.local
    duration: 2160h
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: afs-ca
    privateKey:
        algorithm: ECDSA
        rotationPolicy: Always
        size: 256
    renewBefore: 720h
    secretName: afs-gateway-tls
    usages:
        - server auth
---
apiVersion: v1
data:
    afs-slis.json: |-
        {
          "uid": "afs-slis",
          "title": "AFS service levels",
          "tags": [
            "afs"
          ],
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "time": {
            "from": "now-6h",
            "to": "now"
          },
          "refresh": "1m",
          "templating": {
            "list": [
              {
                "name": "datasource",
                "type": "datasource",
                "query": "prometheus",
                "label": "Data source"
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "API request rate by route",
              "description": "RED: rate",
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (route) (rate(afs_api_requests_total[5m]))",
                  "legendFormat": "{{route}}"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "API errors (5xx ratio)",
              "description": "RED: errors. Availability target 99.9%",
              "gridPos": {
                "x": 12,
                "y": 0,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(afs_api_requests_total{code=~\"5..\"}[5m])) / sum(rate(afs_api_requests_total[5m]))",
                  "legendFormat": "5xx ratio"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "API p50 / p99 latency",
              "description": "RED: duration. Read target p99 < 300 ms, reports < 1 s",
              "gridPos": {
                "x": 0,
                "y": 8,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.5, sum by (le) (rate(afs_api_request_duration_seconds_bucket[5m])))",
                  "legendFormat": "p50"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(afs_api_request_duration_seconds_bucket[5m])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "API p99 by route (top 10)",
              "description": "",
              "gridPos": {
                "x": 12,
                "y": 8,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "topk(10, histogram_quantile(0.99, sum by (le, route) (rate(afs_api_request_duration_seconds_bucket[5m]))))",
                  "legendFormat": "{{route}}"
                }
              ]
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Reconcile lag p50 / p95",
              "description": "Target p95 < 60 s",
              "gridPos": {
                "x": 0,
                "y": 16,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.5, sum by (le) (rate(afs_reconcile_lag_seconds_bucket[10m])))",
                  "legendFormat": "p50"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(afs_reconcile_lag_seconds_bucket[10m])))",
                  "legendFormat": "p95"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Reconcile errors and drift corrections",
              "description": "",
              "gridPos": {
                "x": 12,
                "y": 16,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (kind) (rate(afs_reconcile_errors_total[10m]))",
                  "legendFormat": "errors {{kind}}"
                },
                {
                  "refId": "B",
                  "expr": "sum(increase(afs_drift_corrected_total[1h]))",
                  "legendFormat": "drift per hour"
                }
              ]
            },
            {
              "id": 7,
              "type": "stat",
              "title": "Reconciler leader",
              "description": "Exactly one",
              "gridPos": {
                "x": 0,
                "y": 24,
                "w": 6,
                "h": 4
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(afs_reconciler_is_leader)",
                  "legendFormat": "leaders"
                }
              ]
            },
            {
              "id": 8,
              "type": "timeseries",
              "title": "Gateway added latency p99",
              "description": "Target < 25 ms excluding Bedrock time",
              "gridPos": {
                "x": 6,
                "y": 24,
                "w": 9,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(afs_gateway_added_latency_seconds_bucket[5m])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 9,
              "type": "timeseries",
              "title": "Gateway reservation failures and expired reservations",
              "description": "",
              "gridPos": {
                "x": 15,
                "y": 24,
                "w": 9,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (reason) (increase(afs_gateway_reservation_failures_total[5m]))",
                  "legendFormat": "failed {{reason}}"
                },
                {
                  "refId": "B",
                  "expr": "sum(increase(afs_gateway_reservations_expired_total[1h]))",
                  "legendFormat": "expired per hour"
                }
              ]
            },
            {
              "id": 10,
              "type": "timeseries",
              "title": "Outbox backlog and oldest event age",
              "description": "",
              "gridPos": {
                "x": 0,
                "y": 32,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(afs_outbox_pending_events)",
                  "legendFormat": "pending"
                },
                {
                  "refId": "B",
                  "expr": "max(afs_outbox_oldest_age_seconds)",
                  "legendFormat": "oldest age (s)"
                }
              ]
            },
            {
              "id": 11,
              "type": "timeseries",
              "title": "Outbox publish failures and notification failures",
              "description": "",
              "gridPos": {
                "x": 12,
                "y": 32,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(afs_outbox_publish_failures_total[10m]))",
                  "legendFormat": "publish failures/s"
                },
                {
                  "refId": "B",
                  "expr": "sum by (channel_type) (increase(afs_notification_failures_total[1h]))",
                  "legendFormat": "notifications {{channel_type}}"
                }
              ]
            },
            {
              "id": 12,
              "type": "stat",
              "title": "CUR variance (latest day)",
              "description": "Gateway estimate vs billed",
              "gridPos": {
                "x": 0,
                "y": 40,
                "w": 12,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit"
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(afs_cost_cur_variance_ratio)",
                  "legendFormat": "variance"
                }
              ]
            }
          ]
        }
kind: ConfigMap
metadata:
    labels:
        app.kubernetes.io/component: dashboards
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-dashboards
        app.kubernetes.io/part-of: afs
        grafana_dashboard: "1"
        helm.sh/chart: afs-0.1.0
    name: afs-dashboards
    namespace: afs-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
    labels:
        afs.io/billing-job: cur-ingest
        app.kubernetes.io/component: billing
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-billing
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-0.1.0
    name: afs-billing-cur-ingest
    namespace: afs-system
spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 5
    jobTemplate:
        spec:
            activeDeadlineSeconds: 3600
            backoffLimit: 2
            template:
                metadata:
                    labels:
                        app.kubernetes.io/component: billing
                        app.kubernetes.io/instance: afs
                        app.kubernetes.io/managed-by: Helm
                        app.kubernetes.io/name: afs-billing
                        app.kubernetes.io/part-of: afs
                        helm.sh/chart: afs-0.1.0
                spec:
                    containers:
                        - args:
                            - --job
                            - cur-ingest
                          env:
                            - name: AFS_DATABASE_URL
                              value: postgres://afs_billing@afs.cluster-abc123.us-east-1.rds.amazonaws.com:5432/afs?sslmode=verify-full
                            - name: AFS_DB_IAM_AUTH
                              value: "true"
                            - name: AFS_AWS_REGION
                              value: us-east-1
                            - name: AFS_CLUSTER_NAME
                              value: afs-dev
                            - name: AFS_LOG_LEVEL
                              value: info
                            - name: AFS_OTLP_ENDPOINT
                              value: http://otel-collector.observability:4318
                            - name: AFS_ATHENA_OUTPUT
                              value: s3://afs-athena-results-111122223333/
                            - name: AFS_ATHENA_WORKGROUP
                              value: afs
                            - name: AFS_CUR_DATABASE
                              value: cur
                            - name: AFS_CUR_TABLE
                              value: afs_cur
                            - name: AFS_METRICS_ADDR
                              value: :9090
                            - name: AFS_REPORTS_BUCKET
                              value: afs-reports-111122223333
                          image: 111122223333.dkr.ecr.us-east-1.amazonaws.com/afs/afs-billing:v0.1.0
                          imagePullPolicy: IfNotPresent
                          name: afs-billing
                          ports:
                            - containerPort: 9090
                              name: metrics
                          resources:
                            limits:
                                memory: 1Gi
                            requests:
                                cpu: 250m
                                memory: 256Mi
                          securityContext:
                            allowPrivilegeEscalation: false
                            capabilities:
                                drop:
                                    - ALL
                            readOnlyRootFilesystem: true
                    restartPolicy: Never
                    securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                            type: RuntimeDefault
                    serviceAccountName: afs-billing
    schedule: 0 3 * * *
    successfulJobsHistoryLimit: 3
