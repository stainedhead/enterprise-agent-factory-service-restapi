---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        app.kubernetes.io/component: edge
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-edge
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-1.0.1
    name: afs-edge
    namespace: afs-system
spec:
    dnsNames:
        - afs-edge
        - afs-edge.afs-system
        - afs-edge.afs-system.svc
        - afs-edge.afs-system.svc.cluster.local
    duration: 2160h
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: afs-ca
    privateKey:
        algorithm: ECDSA
        rotationPolicy: Always
        size: 256
    renewBefore: 720h
    secretName: afs-edge-tls
    usages:
        - server auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-gateway
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-1.0.1
    name: afs-gateway
    namespace: afs-system
spec:
    dnsNames:
        - afs-gateway
        - afs-gateway.afs-system
        - afs-gateway.afs-system.svc
        - afs-gateway.afs-system.svc.cluster.local
    duration: 2160h
    issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: afs-ca
    privateKey:
        algorithm: ECDSA
        rotationPolicy: Always
        size: 256
    renewBefore: 720h
    secretName: afs-gateway-tls
    usages:
        - server auth
