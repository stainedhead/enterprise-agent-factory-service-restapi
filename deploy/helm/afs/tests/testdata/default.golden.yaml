apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
    labels:
        app.kubernetes.io/component: slis
        app.kubernetes.io/instance: afs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: afs-slis
        app.kubernetes.io/part-of: afs
        helm.sh/chart: afs-0.1.0
    name: afs-slis
    namespace: afs-system
spec:
    groups:
        - name: afs-api
          rules:
            - alert: AFSAPIReadLatencyHigh
              annotations:
                description: p99 of API reads (reports excluded) has been above target for 10 minutes.
                summary: afs-api read p99 above 0.3 s
              expr: |
                histogram_quantile(0.99, sum by (le) (rate(afs_api_request_duration_seconds_bucket{method="GET", route!~"GetUsage|GetTeamReport|GetAgentReport|GetServiceReport|ListCosts|ListCostReconciliations"}[5m]))) > 0.3
              for: 10m
              labels:
                severity: warning
            - alert: AFSAPIReportLatencyHigh
              annotations:
                summary: afs-api report p99 above 1 s
              expr: |
                histogram_quantile(0.99, sum by (le) (rate(afs_api_request_duration_seconds_bucket{route=~"GetUsage|GetTeamReport|GetAgentReport|GetServiceReport|ListCosts|ListCostReconciliations"}[5m]))) > 1
              for: 10m
              labels:
                severity: warning
            - alert: AFSAPIErrorRatioHigh
              annotations:
                summary: afs-api 5xx ratio above the 99.9% availability budget
              expr: |
                sum(rate(afs_api_requests_total{code=~"5.."}[5m])) / sum(rate(afs_api_requests_total[5m])) > 0.001
              for: 10m
              labels:
                severity: critical
        - name: afs-reconciler
          rules:
            - alert: AFSNoReconcilerLeader
              annotations:
                summary: no afs-reconciler replica holds the leader lease
              expr: sum(afs_reconciler_is_leader) < 1 or absent(afs_reconciler_is_leader)
              for: 1m
              labels:
                severity: critical
            - alert: AFSReconcileLagHigh
              annotations:
                summary: reconcile lag p95 above 60 s
              expr: |
                histogram_quantile(0.95, sum by (le) (rate(afs_reconcile_lag_seconds_bucket[10m]))) > 60
              for: 10m
              labels:
                severity: warning
            - alert: AFSReconcileErrors
              annotations:
                summary: reconciles of {{ $labels.kind }} keep failing
              expr: sum by (kind) (rate(afs_reconcile_errors_total[10m])) > 0
              for: 15m
              labels:
                severity: warning
            - alert: AFSDriftHigh
              annotations:
                summary: more than 10 drift corrections in an hour; something edits managed objects
              expr: sum(increase(afs_drift_corrected_total[1h])) > 10
              labels:
                severity: warning
        - name: afs-gateway
          rules:
            - alert: AFSGatewayReservationFailures
              annotations:
                summary: the gateway rejects calls because it cannot reserve spend ({{ $labels.reason }}); it fails closed
              expr: sum by (reason) (increase(afs_gateway_reservation_failures_total[5m])) > 0
              labels:
                severity: critical
            - alert: AFSGatewayAddedLatencyHigh
              annotations:
                summary: gateway added latency p99 above 0.025 s
              expr: |
                histogram_quantile(0.99, sum by (le) (rate(afs_gateway_added_latency_seconds_bucket[5m]))) > 0.025
              for: 10m
              labels:
                severity: warning
            - alert: AFSGatewayReservationsExpiring
              annotations:
                summary: spend reservations expire unsettled; a gateway replica is dying mid-request
              expr: sum(increase(afs_gateway_reservations_expired_total[1h])) > 0
              labels:
                severity: warning
        - name: afs-events-and-billing
          rules:
            - alert: AFSOutboxLagHigh
              annotations:
                summary: the oldest unpublished event is older than 300 s
              expr: max(afs_outbox_oldest_age_seconds) > 300
              for: 5m
              labels:
                severity: warning
            - alert: AFSOutboxPublishFailing
              annotations:
                summary: outbox events fail to reach EventBridge
              expr: sum(rate(afs_outbox_publish_failures_total[10m])) > 0
              for: 15m
              labels:
                severity: warning
            - alert: AFSNotificationFailures
              annotations:
                summary: notifications to {{ $labels.channel_type }} channels fail
              expr: sum by (channel_type) (increase(afs_notification_failures_total[1h])) > 0
              labels:
                severity: warning
            - alert: AFSCURVarianceHigh
              annotations:
                summary: gateway cost estimates differ from the CUR by more than 5 percent
              expr: max(afs_cost_cur_variance_ratio) > 0.05
              for: 1h
              labels:
                severity: warning
            - alert: AFSBillingJobFailed
              annotations:
                summary: billing job {{ $labels.job_name }} failed
              expr: sum by (job_name) (kube_job_status_failed{namespace="afs-system", job_name=~"afs-billing-.+"}) > 0
              labels:
                severity: warning
