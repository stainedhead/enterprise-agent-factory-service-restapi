enabled: true
image:
  repository: afs-billing
dbUser: afs_billing
serviceAccount:
  name: afs-billing
ports:
  metrics: 9090
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {memory: 1Gi}
env:
  AFS_METRICS_ADDR: ":9090"
# Required: AFS_CUR_DATABASE, AFS_CUR_TABLE, AFS_ATHENA_WORKGROUP, AFS_ATHENA_OUTPUT,
# AFS_REPORTS_BUCKET, AFS_REPORTS_KMS_KEY_ID (from Terraform outputs reports_bucket, buckets_kms_key_id).
# Optional: AFS_SHOWBACK_TAG_KEY (second showback dimension).
# cost-tags (M5-F1) needs no extra settings: it reads the CUR rows cur-ingest stored and calls Cost Explorer
# (ce:ListCostAllocationTags on the billing role, Terraform billing policy).
# The reconcile job logs each day with metric=afs_cost_cur_variance_ratio (WARN over the threshold):
# match it with a CloudWatch Logs metric filter; the CronJob pod exits before Prometheus can scrape it.
# Route billing (1.2.0): route-pull reads each provider's admin key from <prefix>/_service/billing/<route>
# (Secrets Manager; grant the billing role secretsmanager:GetSecretValue on that path only). Optional:
# AFS_BILLING_AZURE_SCOPES ("route=/subscriptions/<id>[/resourceGroups/<rg>],..."), AFS_BILLING_GOOGLE_EXPORTS
# ("route=<project>:<dataset>.<table>,..."), AFS_ROUTE_PRICE_LIST_URL (default LiteLLM's published list).
# route-pull runs late in the UTC day because OpenRouter reports the current day only.
# One CronJob per entry; `job` is passed as `afs-billing --job <job>` (M4-C1).
cronjobs:
  cur-ingest:      {schedule: "0 3 * * *",    job: cur-ingest}
  reconcile:       {schedule: "0 4 * * *",    job: reconcile}
  price-sync:      {schedule: "0 5 * * 1",    job: price-sync}
  report-schedules: {schedule: "*/15 * * * *", job: report-schedules}
  showback:        {schedule: "0 6 * * *",    job: showback}
  cost-tags:       {schedule: "30 6 * * *",   job: cost-tags}
  route-pull:      {schedule: "30 23 * * *",  job: route-pull}
  route-statements: {schedule: "0 7 5 * *",   job: route-statements}
  route-capacity:  {schedule: "15 4 * * *",   job: route-capacity}
  route-price-sync: {schedule: "30 5 * * *",  job: route-price-sync}
concurrencyPolicy: Forbid
backoffLimit: 2
activeDeadlineSeconds: 3600
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 5
