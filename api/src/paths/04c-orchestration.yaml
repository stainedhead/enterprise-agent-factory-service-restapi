      in: query
      schema:
        type: string
        enum:
        - private
        - public
    - name: tool
      in: query
      schema:
        type: string
        enum:
        - paperclip
        - buzz
    - name: teamId
      in: query
      schema:
        type: string
        pattern: ^team_[0-9A-HJKMNP-TV-Z]{26}$
    - name: state
      in: query
      schema:
        type: string
        enum:
        - Ready
        - Degraded
        - Failed
