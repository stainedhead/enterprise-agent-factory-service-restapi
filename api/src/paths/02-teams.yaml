/v1/teams/{teamId}/kubeconfig:
  get:
    operationId: GetTeamKubeconfig
    summary: Get team kubeconfig
    tags:
    - teams
    description: (YAML, exec credential plugin, no token in the file)
    parameters:
    - $ref: '#/components/parameters/TeamId'
    - $ref: '#/components/parameters/XRequestId'
    responses:
      '200':
        description: Success
        headers:
          X-Request-Id:
            $ref: '#/components/headers/XRequestId'
          X-Afs-Contract-Version:
            $ref: '#/components/headers/XAfsContractVersion'
        content:
          application/yaml:
            schema:
              type: string
            example: |
              apiVersion: v1
              kind: Config
              clusters:
                - name: afs
                  cluster:
                    server: https://EXAMPLE0123456789.gr7.us-east-1.eks.amazonaws.com
                    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCkVYQU1QTEUKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
              contexts:
                - name: afs-payments
                  context: {cluster: afs, namespace: afs-payments, user: afs}
              current-context: afs-payments
              users:
                - name: afs
                  user:
                    exec:
                      apiVersion: client.authentication.k8s.io/v1beta1
                      command: aws
                      args: [eks, get-token, --cluster-name, afs, --region, us-east-1]
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/AccessDenied'
      '404':
        $ref: '#/components/responses/NotFound'
      '429':
        $ref: '#/components/responses/Throttled'
      '500':
        $ref: '#/components/responses/InternalError'
      '503':
        $ref: '#/components/responses/Unavailable'
    x-afs-permission: teams:get-kubeconfig
    x-afs-scope: team
    x-afs-cli: teams get-kubeconfig
    x-afs-sdk: teams.getKubeconfig()
    x-afs-screen: T1, V1
