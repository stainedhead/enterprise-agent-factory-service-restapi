# API contract v1.6.0 §4.14: governed MCP servers and federated identities. Generated once from the contract, then hand-maintained.
/v1/mcp-servers:
  get:
    operationId: ListMcpServers
    summary: List MCP servers
    tags:
    - mcp-servers
    parameters:
    - name: scope
      in: query
      schema:
        type: string
        enum:
        - enterprise
        - team
        - all
    - name: reviewStatus
      in: query
      schema:
        type: string
        enum:
        - draft
        - pending_review
        - approved
        - rejected
        - suspended
    - name: riskTier
      in: query
      schema:
        type: string
        enum:
        - low
        - elevated
        - high
    - name: teamId
      in: query
      schema:
        type: string
        pattern: ^team_[0-9A-HJKMNP-TV-Z]{26}$
    - name: location
      in: query
      schema:
        type: string
        enum:
        - external
        - corporate
        - in_namespace
    - $ref: '#/components/parameters/MaxResults'
    - $ref: '#/components/parameters/NextToken'
    - $ref: '#/components/parameters/XRequestId'
    responses:
      '200':
        description: Success
        headers:
          X-Request-Id:
            $ref: '#/components/headers/XRequestId'
          X-Afs-Contract-Version:
            $ref: '#/components/headers/XAfsContractVersion'
          X-Afs-Next-Token:
            $ref: '#/components/headers/XAfsNextToken'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerList'
            example:
              items:
              - id: mcp_01JD2Q3R4S5T6V7W8X9Y0Z0001
                teamId: null
                scope: enterprise
                slug: github
                displayName: GitHub
                owner: Developer platform
                purpose: Repositories, issues and pull requests
                docUrl: https://docs.github.com/en/copilot/how-tos/provide-context/use-mcp
                dataClassification: internal
                transport: streamable_http
                location: external
                url: https://api.githubcopilot.com/mcp/
                hosted: null
                authKind: oauth_client
                authHeader: null
                credentialMode: per_team
                federation: null
                protocolVersion: '2026-07-28'
                reviewStatus: approved
                published: true
                riskTier: elevated
