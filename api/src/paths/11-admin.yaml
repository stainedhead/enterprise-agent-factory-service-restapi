# OpenAPI fragment (API contract §4.11). Bundled into api/openapi.yaml by make openapi.
/v1/admin/settings:
  get:
    operationId: GetSettings
    summary: Get settings
    tags:
    - admin
    description: (every key of root PRD §6.13 with value, default and range)
    parameters:
    - $ref: '#/components/parameters/XRequestId'
    responses:
      '200':
        description: Success
        headers:
          X-Request-Id:
            $ref: '#/components/headers/XRequestId'
          X-Afs-Contract-Version:
            $ref: '#/components/headers/XAfsContractVersion'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
            example:
              items:
              - key: secrets.path_prefix
                value: afs
                default: afs
                type: string
                allowed: '`^[a-z][a-z0-9-]{0,30}$`; applies to new secrets only'
                pattern: ^[a-z][a-z0-9-]{0,30}$
                version: 1
                updatedAt: null
              - key: pricing.price_list_sync
                value: true
                default: true
                type: boolean
                allowed: boolean
                version: 1
                updatedAt: null
              - key: billing.variance_alert_pct
                value: 5
                default: 5
                type: integer
                allowed: 0 to 100
                min: 0
                max: 100
                version: 1
                updatedAt: null
              - key: api.idempotency_key_ttl_seconds
                value: 3600
                default: 3600
                type: integer
                allowed: 60 to 604800
                min: 60
                max: 604800
                version: 1
                updatedAt: null
              - key: teams.ephemeral_max_days
                value: 90
                default: 90
                type: integer
                allowed: 1 to 365
                min: 1
                max: 365
                version: 1
                updatedAt: null
              - key: work_orders.sla_warning_hours
                value: 48
                default: 48
                type: integer
                allowed: 1 to 720
                min: 1
                max: 720
                version: 1
                updatedAt: null
              - key: billing.tag_activation_acknowledged
                value: false
                default: false
                type: boolean
                allowed: boolean; setting it to `true` is how S9's banner is acknowledged
                version: 1
                updatedAt: null
              - key: work_orders.notification_channel_id
                value: null
                default: null
                type: string
                allowed: null, or the id (`nch_<ulid>`) of a service-level email channel
                nullable: true
                pattern: ^nch_[0-9A-HJKMNP-TV-Z]{26}$
                version: 1
                updatedAt: null
              - key: reports.idle_cpu_millicores
                value: 50
                default: 50
                type: integer
                allowed: 1 to 4000
                min: 1
                max: 4000
                version: 1
                updatedAt: null
              - key: egress.denied_spike_threshold
                value: 20
                default: 20
                type: integer
                allowed: 1 to 100000 denials per agent or pool in 5 minutes
                min: 1
                max: 100000
                version: 1
                updatedAt: null
              - key: gateway.reservation_ttl_seconds
                value: 900
                default: 900
                type: integer
                allowed: 60 to 3600
                min: 60
                max: 3600
                version: 1
                updatedAt: null
              - key: api.cors_origins
                value: []
                default: []
                type: array
                allowed: array of `https://host[:port]` origins
                pattern: ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$
                version: 1
                updatedAt: null
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/AccessDenied'
      '429':
        $ref: '#/components/responses/Throttled'
      '500':
        $ref: '#/components/responses/InternalError'
      '503':
        $ref: '#/components/responses/Unavailable'
    x-afs-permission: admin:settings
    x-afs-scope: service
    x-afs-cli: admin get-settings
    x-afs-sdk: admin.settings.get()
    x-afs-screen: S10
    x-afs-priority: P0
    x-afs-csv: false
    x-afs-events: []
/v1/admin/settings/{key}:
  put:
    operationId: PutSetting
    summary: Put setting
    tags:
    - admin
    description: '{value}'
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
        enum:
        - secrets.path_prefix
        - pricing.price_list_sync
        - billing.variance_alert_pct
        - api.idempotency_key_ttl_seconds
        - teams.ephemeral_max_days
        - work_orders.sla_warning_hours
        - billing.tag_activation_acknowledged
        - work_orders.notification_channel_id
        - reports.idle_cpu_millicores
        - egress.denied_spike_threshold
        - gateway.reservation_ttl_seconds
        - api.cors_origins
    - $ref: '#/components/parameters/XRequestId'
    - $ref: '#/components/parameters/IfMatchPut'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PutSettingRequest'
          example:
            value: 7200
    responses:
      '200':
        description: Success
        headers:
          X-Request-Id:
            $ref: '#/components/headers/XRequestId'
          X-Afs-Contract-Version:
            $ref: '#/components/headers/XAfsContractVersion'
          ETag:
            $ref: '#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Setting'
            example:
              key: api.idempotency_key_ttl_seconds
              value: 7200
              default: 3600
              type: integer
              allowed: 60 to 604800
              min: 60
              max: 604800
              version: 2
              updatedAt: '2026-11-21T18:05:00Z'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/AccessDenied'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/Conflict'
      '412':
        $ref: '#/components/responses/PreconditionFailed'
      '428':
        $ref: '#/components/responses/PreconditionRequired'
      '429':
        $ref: '#/components/responses/Throttled'
      '500':
        $ref: '#/components/responses/InternalError'
      '503':
        $ref: '#/components/responses/Unavailable'
    x-afs-permission: admin:settings
    x-afs-scope: service
    x-afs-cli: admin put-setting
    x-afs-sdk: admin.settings.put()
    x-afs-screen: S10, S9
    x-afs-priority: P0
    x-afs-csv: false
    x-afs-events: []
