# OpenAPI fragment (API contract §4.10a). Bundled into api/openapi.yaml by make openapi.
/v1/work-orders:
  get:
    operationId: ListWorkOrders
    summary: List work orders
    tags:
    - work-orders
    parameters:
    - name: status
      in: query
      schema:
        type: string
        enum:
        - open
        - assigned
        - in_progress
        - pr_opened
        - done
        - failed
        - cancelled
    - name: severity
      in: query
      schema:
        type: string
        enum:
        - critical
        - high
        - medium
        - low
    - name: slaState
      in: query
      schema:
        type: string
        enum:
        - on_track
        - due_soon
        - breached
        - met
        - missed
    - name: teamId
      in: query
      schema:
        type: string
        pattern: ^team_[0-9A-HJKMNP-TV-Z]{26}$
        example: team_01JD2Q3R4S5T6V7W8X9Y0Z0001
    - $ref: '#/components/parameters/MaxResults'
    - $ref: '#/components/parameters/NextToken'
    - $ref: '#/components/parameters/XRequestId'
    responses:
      '200':
        description: Success
        headers:
          X-Request-Id:
            $ref: '#/components/headers/XRequestId'
          X-Afs-Contract-Version:
            $ref: '#/components/headers/XAfsContractVersion'
          X-Afs-Next-Token:
            $ref: '#/components/headers/XAfsNextToken'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderList'
            example:
              items:
              - id: wo_01JD2Q3R4S5T6V7W8X9Y0Z0001
                version: 1
                createdAt: '2026-11-21T18:00:00Z'
                createdBy: usr_01JD2Q3R4S5T6V7W8X9Y0Z0001
                updatedAt: '2026-11-21T18:00:00Z'
                kind: cve_remediation
                cveId: CVE-2026-1234
                severity: critical
                title: OpenSSL remote code execution
                source: api
                templateId: swt_01JD2Q3R4S5T6V7W8X9Y0Z0001
                budgetUsd: '500.00'
                slaDueAt: '2026-11-28T18:00:00Z'
                status: assigned
                teamId: team_01JD2Q3R4S5T6V7W8X9Y0Z0002
                assignedAt: '2026-11-21T18:05:00Z'
                completedAt: null
                slaState: on_track
                progress:
                  repos: 1
                  prsOpen: 1
                  prsMerged: 0
                  notAffected: 0
                  failedOrSkipped: 0
                  remaining: 0
                cancelReason: null
          text/csv:
            schema:
              type: string
            example: "id,cveId,severity,title,status,slaState,teamId,slaDueAt\r\nwo_01JD2Q3R4S5T6V7W8X9Y0Z0001,CVE-2026-1234,critical,OpenSSL\
              \ remote code execution,assigned,on_track,team_01JD2Q3R4S5T6V7W8X9Y0Z0002,2026-11-28T18:00:00Z\r\n"
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/AccessDenied'
      '429':
        $ref: '#/components/responses/Throttled'
      '500':
        $ref: '#/components/responses/InternalError'
      '503':
        $ref: '#/components/responses/Unavailable'
    x-afs-permission: work-orders:read
    x-afs-scope: any
    x-afs-condition: assignedOrOwnRepos
    x-afs-cli: work-orders list-work-orders
    x-afs-sdk: workOrders.list()
    x-afs-screen: P3
    x-afs-priority: P2
    x-afs-csv: true
