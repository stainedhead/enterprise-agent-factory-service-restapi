/v1/work-orders/{workOrderId}/repos/{host}/{owner}/{repo}:
  patch:
    operationId: UpdateWorkOrderRepo
    summary: Update work order repo
    tags:
    - work-orders
    description: '{status, prUrl?, prNumber?, detail?}. A workload principal (a worker of the assigned team) holds
      no read of the repository version, so it may omit If-Match: the update then applies to the current version. A
      version it does send is compared (412 when stale). Every other caller must send If-Match.'
    parameters:
    - name: workOrderId
      in: path
      required: true
      schema:
        type: string
        pattern: ^wo_[0-9A-HJKMNP-TV-Z]{26}$
        example: wo_01JD2Q3R4S5T6V7W8X9Y0Z0001
    - name: host
      in: path
      required: true
      schema:
        type: string
        example: github.com
    - name: owner
      in: path
      required: true
      schema:
        type: string
        example: example-org
    - name: repo
      in: path
      required: true
      schema:
        type: string
        example: payments-api
    - $ref: '#/components/parameters/XRequestId'
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateWorkOrderRepoRequest'
          example:
            status: pr_opened
            prUrl: https://github.com/example-org/payments-api/pull/412
            prNumber: 412
            detail: Bumped openssl
    responses:
      '200':
        description: Success
        headers:
          X-Request-Id:
            $ref: '#/components/headers/XRequestId'
          X-Afs-Contract-Version:
            $ref: '#/components/headers/XAfsContractVersion'
          ETag:
            $ref: '#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderRepo'
            example:
              host: github.com
              repo: example-org/payments-api
              owningTeamId: team_01JD2Q3R4S5T6V7W8X9Y0Z0001
              owningContact: null
              status: pr_opened
              prUrl: https://github.com/example-org/payments-api/pull/412
