# OpenAPI components (API contract §1, §2, §6). Bundled into api/openapi.yaml by make openapi.
headers:
  ETag:
    schema:
      type: string
      example: '"3"'
    description: '"<version>" of the returned resource'
  XRequestId:
    schema:
      type: string
    description: The request id (echoed or generated)
  XAfsContractVersion:
    schema:
      type: string
      example: 1.1.0
    description: API contract version (D47)
  IdempotentReplayed:
    schema:
      type: string
      enum:
      - 'true'
    description: Present when the response is a stored replay
  RetryAfter:
    schema:
      type: integer
      minimum: 1
    description: Seconds to wait before retrying
  XAfsNextToken:
    schema:
      type: string
    description: Next page token of a CSV response; absent on the last page
  Deprecation:
    schema:
      type: string
      example: '@1795392000'
    description: 'RFC 9745 Deprecation: @<unix time of the 1.1.0 release>'
  Sunset:
    schema:
      type: string
      example: Tue, 23 Nov 2027 00:00:00 GMT
    description: HTTP-date of the planned removal (2.0.0); Helm value deprecation.sunset
  Link:
    schema:
      type: string
      example: </v1/teams/team_01JD2Q3R4S5T6V7W8X9Y0Z0001/orchestration>; rel="successor-version"
    description: The successor operation
