# OpenAPI components (API contract §1, §2, §6). Bundled into api/openapi.yaml by make openapi.
schemas:
  Timestamp:
    type: string
    format: date-time
    description: RFC 3339 UTC with Z
    example: '2026-11-21T18:00:00Z'
  Money:
    type: string
    pattern: ^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
    description: USD amount as a decimal string with at most 6 fraction digits; never a JSON number
    example: '1234.50'
  Name:
    type: string
    pattern: ^[a-z][a-z0-9-]{1,38}[a-z0-9]$
    description: Immutable name (team slug, agent, pool, secret)
    example: payments
  ConfigName:
    type: string
    pattern: ^[A-Z][A-Z0-9_]{0,127}$
    description: UPPER_SNAKE configuration value name; credential-like names are refused
    example: LOG_LEVEL
  AwsAccountId:
    type: string
    pattern: ^[0-9]{12}$
    example: '111122223333'
  ImageRef:
    type: string
    pattern: '@sha256:[0-9a-f]{64}$'
    description: Container image pinned by digest
    example: registry.example.com/agents/coder@sha256:4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f
  Phase:
    type: string
    enum:
    - Pending
    - Reconciling
    - Ready
    - Degraded
    - Failed
    - Deleting
  Condition:
    type: object
    required:
    - type
    - status
    - lastTransitionTime
    properties:
      type:
        type: string
        description: NamespaceReady, IamReady, SecretsSynced, VolumeReady, EgressPolicyReady, TemplateRetired, DriftCorrected,
          BudgetExhausted, DeliveryHealthy; open list
      status:
        type: string
        enum:
        - 'True'
        - 'False'
        - Unknown
      reason:
        type: string
        description: CamelCase reason
      message:
        type: string
      lastTransitionTime:
        $ref: '#/components/schemas/Timestamp'
  Status:
    type: object
    description: Reconcile status of a desired-state resource (contract §1.1)
    required:
    - phase
    - observedGeneration
    - conditions
    - updatedAt
    properties:
      phase:
        $ref: '#/components/schemas/Phase'
      observedGeneration:
        type: integer
        minimum: 0
      conditions:
        type: array
        items:
          $ref: '#/components/schemas/Condition'
      updatedAt:
        $ref: '#/components/schemas/Timestamp'
  ResourceStatus:
    type: object
    description: Status of one resource, returned by the …/status operations
    required:
    - id
    - kind
    - generation
    - status
    properties:
      id:
        type: string
      kind:
        type: string
      generation:
        type: integer
        minimum: 1
      status:
        $ref: '#/components/schemas/Status'
  FieldError:
    type: object
    required:
    - field
    - reason
    properties:
      field:
        type: string
      reason:
        type: string
  ErrorCode:
    type: string
    enum:
    - ValidationError
    - Unauthenticated
    - AccessDenied
    - NotFound
    - Conflict
    - PreconditionFailed
    - PreconditionRequired
    - Throttled
    - InternalError
    - Unavailable
    description: API contract §6 codes returned by afs-api (BudgetExceeded and UpstreamError come only from afs-gateway)
  AmbiguousRepo:
    type: object
    required:
    - repo
    - teamIds
    properties:
      repo:
        type: string
        description: host/owner/repo
      teamIds:
        type: array
        items:
          type: string
          pattern: ^team_[0-9A-HJKMNP-TV-Z]{26}$
          example: team_01JD2Q3R4S5T6V7W8X9Y0Z0001
  ErrorDetails:
    type: object
    description: Machine-readable details; which fields appear depends on code and reason. Never holds a secret value
    properties:
      fields:
        type: array
        items:
          $ref: '#/components/schemas/FieldError'
      requiredPermission:
        type: string
        example: teams:write
      reason:
        type: string
        description: idempotency_mismatch, idempotency_in_progress, team_suspended, not_implemented and others
      missingTags:
        type: array
        items:
          type: string
      ambiguousRepos:
        type: array
        items:
          $ref: '#/components/schemas/AmbiguousRepo'
      unownedRepos:
        type: array
        items:
          type: string
          description: host/owner/repo
      dependents:
        type: array
        items:
          type: string
        description: Ids of objects that block a delete (for example the agents bound to a secret)
  Error:
    type: object
    required:
    - code
    - message
    - requestId
    - details
    properties:
      code:
        $ref: '#/components/schemas/ErrorCode'
      message:
        type: string
        description: For people; may change. Clients branch on code
      requestId:
        type: string
      details:
        $ref: '#/components/schemas/ErrorDetails'
  HealthStatus:
    type: object
    required:
    - status
    properties:
      status:
        type: string
        enum:
        - ok
        - ready
        - not ready
      checks:
        type: object
        additionalProperties:
          type: string
        description: 'Per dependency: ok or the failure'
  Quotas:
    type: object
    properties:
      cpu:
        type: string
        example: '16'
      memory:
        type: string
        example: 64Gi
      pods:
        type: integer
        minimum: 1
      storage:
        type: string
        example: 500Gi
  Resources:
    type: object
    properties:
      cpu:
        type: string
        example: '1'
      memory:
        type: string
        example: 2Gi
  TagValue:
    type: object
    required:
    - key
    - value
    properties:
      key:
        type: string
      value:
        type: string
