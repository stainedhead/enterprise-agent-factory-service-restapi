# OpenAPI fragment (API contract §4.3 and §5 shapes). Bundled into api/openapi.yaml by make openapi.
Member:
  type: object
  required:
  - id
  - role
  - subjectType
  - version
  properties:
    id:
      type: string
      pattern: ^rb_[0-9A-HJKMNP-TV-Z]{26}$
      example: rb_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version; ETag is "<version>"
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    createdBy:
      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    role:
      type: string
      enum:
      - team_admin
      - team_collaborator
      - team_viewer
    subjectType:
      type: string
      enum:
      - user
      - group
    userId:
      type: string
      pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
      example: usr_01JD2Q3R4S5T6V7W8X9Y0Z0001
    email:
      type: string
      format: email
      readOnly: true
    groupName:
      type: string
    identityProviderId:
      type: string
      pattern: ^idp_[0-9A-HJKMNP-TV-Z]{26}$
      example: idp_01JD2Q3R4S5T6V7W8X9Y0Z0001
MemberList:
  type: object
  description: A page of Member resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/Member'
    nextToken:
      type: string
      description: Absent on the last page
