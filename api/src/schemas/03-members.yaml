  type: object
  required:
  - role
  properties:
    role:
      type: string
      enum:
      - team_admin
      - team_collaborator
      - team_viewer
ApiKey:
  type: object
  required:
  - id
  - name
  - role
  - keyPrefix
  - expiresAt
  - createdAt
  properties:
    id:
      type: string
      pattern: ^key_[0-9A-HJKMNP-TV-Z]{26}$
      example: key_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    name:
      type: string
      minLength: 1
      maxLength: 100
    role:
      type: string
      enum:
      - team_admin
      - team_collaborator
      - team_viewer
      - security_operator
    keyPrefix:
      type: string
      example: afsk_3f9a
      readOnly: true
    expiresAt:
      $ref: '#/components/schemas/Timestamp'
    lastUsedAt:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    createdBy:
      type: string
      readOnly: true
    secretKey:
      type: string
      description: Create response only; shown once, never stored or returned again (D52)
      readOnly: true
