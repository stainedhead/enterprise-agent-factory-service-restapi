# OpenAPI fragment (API contract §4.6 and §5 shapes). Bundled into api/openapi.yaml by make openapi.
Secret:
  type: object
  description: Secret metadata. There is no value field, ever
  required:
  - id
  - scope
  - name
  - secretsManagerPath
  - version
  properties:
    id:
      type: string
      pattern: ^sec_[0-9A-HJKMNP-TV-Z]{26}$
      example: sec_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version; ETag is "<version>"
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    createdBy:
      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    managedBy:
      type: string
      enum:
      - user
      - afs
      - paperclip
      readOnly: true
    scope:
      type: string
      enum:
      - team
      - agent
      - pool
    agentId:
      type: string
      pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
      example: agt_01JD2Q3R4S5T6V7W8X9Y0Z0001
    poolId:
      type: string
      pattern: ^pool_[0-9A-HJKMNP-TV-Z]{26}$
      example: pool_01JD2Q3R4S5T6V7W8X9Y0Z0001
    name:
      type: string
      pattern: ^[a-z][a-z0-9-]{0,62}$
    description:
      type: string
    externalSystemId:
      type:
      - string
      - 'null'
      pattern: ^ext_[0-9A-HJKMNP-TV-Z]{26}$
      example: ext_01JD2Q3R4S5T6V7W8X9Y0Z0001
    secretsManagerPath:
      type: string
      readOnly: true
    secretsManagerArn:
      type: string
      readOnly: true
    versionId:
      type: string
      readOnly: true
    lastChangedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    rotation:
      type: object
      properties:
        enabled:
          type: boolean
        days:
          type: integer
          minimum: 1
          maximum: 365
    boundTo:
      type: array
      items:
        type: string
        pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
        example: agt_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
SecretList:
  type: object
  description: A page of Secret resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/Secret'
    nextToken:
      type: string
      description: Absent on the last page
SecretValue:
  type: string
  minLength: 1
  maxLength: 65536
  description: Sent once, passed to Secrets Manager and dropped; never returned, logged or audited
  writeOnly: true
CreateSecretRequest:
  type: object
  required:
  - scope
  - name
  - value
  properties:
    scope:
      type: string
      enum:
      - team
      - agent
      - pool
    agentId:
      type: string
      pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
      example: agt_01JD2Q3R4S5T6V7W8X9Y0Z0001
    poolId:
      type: string
      pattern: ^pool_[0-9A-HJKMNP-TV-Z]{26}$
      example: pool_01JD2Q3R4S5T6V7W8X9Y0Z0001
    name:
      type: string
      pattern: ^[a-z][a-z0-9-]{0,62}$
    description:
      type: string
    externalSystemId:
      type: string
      pattern: ^ext_[0-9A-HJKMNP-TV-Z]{26}$
      example: ext_01JD2Q3R4S5T6V7W8X9Y0Z0001
    rotation:
      type: object
      properties:
        enabled:
          type: boolean
        days:
          type: integer
          minimum: 1
          maximum: 365
    value:
      $ref: '#/components/schemas/SecretValue'
UpdateSecretRequest:
  type: object
  properties:
    description:
      type: string
    externalSystemId:
      type:
      - string
      - 'null'
      pattern: ^ext_[0-9A-HJKMNP-TV-Z]{26}$
      example: ext_01JD2Q3R4S5T6V7W8X9Y0Z0001
    rotation:
      type: object
      properties:
        enabled:
          type: boolean
        days:
          type: integer
          minimum: 1
          maximum: 365
PutSecretValueRequest:
  type: object
  required:
  - value
  properties:
    value:
      $ref: '#/components/schemas/SecretValue'
RotateSecretRequest:
  type: object
  description: Writes a new Secrets Manager version with this value. Required for a secret a team manages; an AFS-managed secret takes no body (AFS generates the value) and a Paperclip secret is refused (409 managed_secret)
  properties:
    value:
      $ref: '#/components/schemas/SecretValue'
