RestoreRevisionRequest:
  type: object
  properties:
    dryRun:
      type: boolean
      default: false
RestoreChange:
  type: object
  required:
  - resourceKind
  - resourceId
  - action
  properties:
    resourceKind:
      type: string
    resourceId:
      type: string
    action:
      type: string
      enum:
      - create
      - update
      - delete
      - skip
    fields:
      type: array
      items:
        type: object
        required:
        - field
        properties:
          field:
            type: string
          from: {}
          to: {}
    reason:
      type:
      - string
      - 'null'
RestoreResult:
  type: object
  required:
  - dryRun
  - revision
  - changes
  properties:
    dryRun:
      type: boolean
    revision:
      type: integer
    changes:
      type: array
      items:
        $ref: '#/components/schemas/RestoreChange'
    skipped:
      type: array
      items:
        $ref: '#/components/schemas/RestoreChange'
      description: Bindings or references that no longer resolve
