# OpenAPI fragment (API contract §4.10 and §5 shapes). Bundled into api/openapi.yaml by make openapi.
LogDestination:
  type: object
  required:
  - id
  - name
  - kind
  - config
  - enabled
  - version
  - generation
  - status
  properties:
    id:
      type: string
      pattern: ^log_[0-9A-HJKMNP-TV-Z]{26}$
      example: log_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version; ETag is "<version>"
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    createdBy:
      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    generation:
      type: integer
      minimum: 1
      readOnly: true
    status:
      $ref: '#/components/schemas/Status'
      readOnly: true
    name:
      type: string
      minLength: 1
      maxLength: 100
    kind:
      type: string
      enum:
      - cloudwatch
      - s3
      - otlp
      - splunk_hec
      - datadog
    config:
      type: object
      description: Kind-specific settings; never a credential (use secretId)
    secretId:
      type:
      - string
      - 'null'
      pattern: ^sec_[0-9A-HJKMNP-TV-Z]{26}$
      example: sec_01JD2Q3R4S5T6V7W8X9Y0Z0001
    enabled:
      type: boolean
LogDestinationList:
  type: object
  description: A page of LogDestination resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/LogDestination'
    nextToken:
      type: string
      description: Absent on the last page
CreateLogDestinationRequest:
  type: object
  required:
  - name
  - kind
  - config
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    kind:
      type: string
      enum:
      - cloudwatch
      - s3
      - otlp
      - splunk_hec
      - datadog
    config:
      type: object
    secretId:
      type: string
      pattern: ^sec_[0-9A-HJKMNP-TV-Z]{26}$
      example: sec_01JD2Q3R4S5T6V7W8X9Y0Z0001
    enabled:
      type: boolean
UpdateLogDestinationRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    config:
      type: object
    secretId:
      type:
      - string
      - 'null'
      pattern: ^sec_[0-9A-HJKMNP-TV-Z]{26}$
      example: sec_01JD2Q3R4S5T6V7W8X9Y0Z0001
    enabled:
      type: boolean
DeliveryStatus:
  type: object
  description: From the channel's DeliveryHealthy condition
  properties:
    healthy:
      type:
      - boolean
      - 'null'
    lastDeliveredAt:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    lastFailureAt:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    lastError:
      type:
      - string
      - 'null'
    lastTestId:
      type:
      - string
      - 'null'
NotificationChannel:
  type: object
  required:
  - id
  - name
  - kind
  - config
  - eventTypes
  - enabled
  - version
  - generation
  - status
  properties:
    id:
      type: string
      pattern: ^nch_[0-9A-HJKMNP-TV-Z]{26}$
      example: nch_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version; ETag is "<version>"
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    createdBy:
      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    generation:
      type: integer
      minimum: 1
      readOnly: true
    status:
      $ref: '#/components/schemas/Status'
      readOnly: true
    name:
      type: string
      minLength: 1
      maxLength: 100
    kind:
      type: string
      enum:
      - slack
      - email
      - webhook
      - jira
      - eventbridge
    config:
      type: object
      description: Kind-specific settings; never a credential (use secretId)
    secretId:
      type:
      - string
      - 'null'
      pattern: ^sec_[0-9A-HJKMNP-TV-Z]{26}$
      example: sec_01JD2Q3R4S5T6V7W8X9Y0Z0001
    eventTypes:
      type: array
      items:
        type: string
      description: Event types or prefixes such as budget.*
    enabled:
      type: boolean
    delivery:
      $ref: '#/components/schemas/DeliveryStatus'
      readOnly: true
