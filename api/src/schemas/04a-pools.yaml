      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    name:
      $ref: '#/components/schemas/Name'
    position:
      type: integer
      minimum: 1
      maximum: 50
    description:
      type: string
