# OpenAPI fragment (API contract §4.4 and §5 shapes). Bundled into api/openapi.yaml by make openapi.
SecretBinding:
  type: object
  required:
  - secretId
  - delivery
  - target
  properties:
    secretId:
      type: string
      pattern: ^sec_[0-9A-HJKMNP-TV-Z]{26}$
      example: sec_01JD2Q3R4S5T6V7W8X9Y0Z0001
    delivery:
      type: string
      enum:
      - env
      - file
    target:
      type: string
      description: Environment variable name or file path
AgentVolume:
  type: object
  properties:
    sizeGiB:
      type: integer
      minimum: 1
      maximum: 1000
      description: Grow-only
    storageClass:
      type: string
      description: Create-only
    onDelete:
      type: string
      enum:
      - snapshot_then_delete
      - delete
      - retain
    snapshotSchedule:
      type: string
      enum:
      - 'off'
      - daily
      - weekly
    snapshotRetain:
      type: integer
      minimum: 1
      maximum: 90
Agent:
  type: object
  description: An agent. It has no replica count (RA-US-4.6)
  required:
  - id
  - name
  - template
  - image
  - iamIdentity
  - paused
  - version
  - generation
  - status
  - models
  properties:
    id:
      type: string
      pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
      example: agt_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    version:
      type: integer
      minimum: 1
      description: Optimistic-concurrency version; ETag is "<version>"
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    createdBy:
      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    generation:
      type: integer
      minimum: 1
      readOnly: true
    status:
      $ref: '#/components/schemas/Status'
      readOnly: true
    name:
      $ref: '#/components/schemas/Name'
      readOnly: true
    role:
      type: string
      enum:
      - worker
      - orchestration
      readOnly: true
      description: worker or orchestration; read-only (a 1.0.1 collaboration reads as orchestration)
    collaboration:
      $ref: '#/components/schemas/AgentCollaboration'
    description:
      type: string
      maxLength: 1000
    template:
      type:
      - string
      - 'null'
      description: Agent template name; null on the orchestration agent for callers who are not service admins
    image:
      oneOf:
      - $ref: '#/components/schemas/ImageRef'
      - type: 'null'
      description: Null on the orchestration agent for callers who are not service admins
    modelId:
      type: string
      deprecated: true
      description: 'Deprecated: models.defaultModelId'
    resources:
      $ref: '#/components/schemas/Resources'
    iamIdentity:
      type: string
      enum:
      - team_shared
      - dedicated
    volume:
      $ref: '#/components/schemas/AgentVolume'
    secretBindings:
      type: array
      items:
        $ref: '#/components/schemas/SecretBinding'
    iamRoleArn:
      type: string
      readOnly: true
    paused:
      type: boolean
      readOnly: true
    models:
      $ref: '#/components/schemas/AgentModels'
    runtime:
      type: string
      enum:
      - orchestration
      description: Present only on the orchestration agent
AgentList:
  type: object
  description: A page of Agent resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/Agent'
    nextToken:
      type: string
      description: Absent on the last page
CreateAgentRequest:
  type: object
  required:
  - name
  - template
  - image
  properties:
    name:
      $ref: '#/components/schemas/Name'
      description: The name orchestrator is reserved (name_reserved)
    role:
      type: string
      enum:
      - worker
      description: Workers only; any other value is refused (role_reserved)
    collaboration:
      $ref: '#/components/schemas/AgentCollaborationInput'
    description:
      type: string
      maxLength: 1000
    template:
      type: string
      description: Agent template name
    image:
      $ref: '#/components/schemas/ImageRef'
    modelId:
      type: string
      deprecated: true
      description: 'Deprecated: models.defaultModelId'
    resources:
      $ref: '#/components/schemas/Resources'
    iamIdentity:
      type: string
      enum:
      - team_shared
      - dedicated
    volume:
      $ref: '#/components/schemas/AgentVolume'
    secretBindings:
      type: array
      items:
        $ref: '#/components/schemas/SecretBinding'
    models:
      $ref: '#/components/schemas/AgentModelsInput'
UpdateAgentRequest:
  type: object
  properties:
    role:
      type: string
      enum:
      - worker
      - orchestration
      - collaboration
      description: Immutable; a value that differs from the agent's role is a ValidationError (collaboration reads as
        orchestration until 2.0.0)
    collaboration:
      $ref: '#/components/schemas/AgentCollaborationInput'
    description:
      type: string
      maxLength: 1000
    template:
      type: string
      description: Agent template name
    image:
      $ref: '#/components/schemas/ImageRef'
    modelId:
      type: string
      deprecated: true
      description: 'Deprecated: models.defaultModelId'
    resources:
      $ref: '#/components/schemas/Resources'
    iamIdentity:
      type: string
      enum:
      - team_shared
      - dedicated
    volume:
      $ref: '#/components/schemas/AgentVolume'
    secretBindings:
      type: array
      items:
        $ref: '#/components/schemas/SecretBinding'
    models:
      $ref: '#/components/schemas/AgentModelsInput'
    name:
      $ref: '#/components/schemas/Name'
      description: Refused on the orchestration agent (orchestration_field_fixed)
Snapshot:
  type: object
  required:
  - id
  - agentId
  - reason
  - state
  - requestedAt
  properties:
    id:
      type: string
      pattern: ^vsnap_[0-9A-HJKMNP-TV-Z]{26}$
      example: vsnap_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    agentId:
      type: string
      pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
      example: agt_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    reason:
      type: string
      enum:
      - scheduled
      - manual
      - pre_delete
      - pre_change
      readOnly: true
    state:
      type: string
      enum:
      - requested
      - pending
      - completed
      - failed
      - deleted
      readOnly: true
    sizeGiB:
      type: integer
      readOnly: true
    requestedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    requestedBy:
      type: string
      readOnly: true
    completedAt:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
      readOnly: true
SnapshotList:
  type: object
  description: A page of Snapshot resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/Snapshot'
    nextToken:
      type: string
      description: Absent on the last page
CreateSnapshotRequest:
  type: object
  properties:
    description:
      type: string
      maxLength: 200
StorageClass:
  type: object
  required:
  - name
  - volumeType
  - enabled
  properties:
    name:
      type: string
      pattern: ^[a-z][a-z0-9-]{0,62}$
    description:
      type: string
    volumeType:
      type: string
      enum:
      - gp3
      - io2
    enabled:
      type: boolean
    version:
      type: integer
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
StorageClassList:
  type: object
  description: A page of StorageClass resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/StorageClass'
    nextToken:
      type: string
      description: Absent on the last page
AgentTemplate:
  type: object
  required:
  - name
  - harness
  - allowedDigests
  - currentDigest
  - enabled
  properties:
    id:
      type: string
      pattern: ^tpl_[0-9A-HJKMNP-TV-Z]{26}$
      example: tpl_01JD2Q3R4S5T6V7W8X9Y0Z0001
      readOnly: true
    name:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,62}$
    description:
      type: string
    harness:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
    defaultResources:
      $ref: '#/components/schemas/Resources'
    allowedDigests:
      type: array
      items:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
    currentDigest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    capabilities:
      type: array
      items:
        type: string
        enum:
        - paperclip
        - orchestration
        - tool:paperclip
        - tool:buzz
    enabled:
      type: boolean
    version:
      type: integer
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
AgentTemplateList:
  type: object
  description: A page of AgentTemplate resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/AgentTemplate'
    nextToken:
      type: string
      description: Absent on the last page
AgentCollaboration:
  type: object
  description: A worker agent's connection to the team's Paperclip (absent on the collaboration agent)
  required:
  - connect
  - linkState
  properties:
    connect:
      type: boolean
    paperclipAgentId:
      type:
      - string
      - 'null'
      pattern: ^[A-Za-z0-9._:-]{1,128}$
    linkState:
      type: string
      enum:
      - pending
      - linked
      - failed
      - disabled
      readOnly: true
    lastSyncedAt:
      type:
      - string
      - 'null'
      format: date-time
      readOnly: true
    lastError:
      type:
      - string
      - 'null'
      readOnly: true
AgentCollaborationInput:
  type: object
  properties:
    connect:
      type: boolean
    paperclipAgentId:
      type: string
      pattern: ^[A-Za-z0-9._:-]{1,128}$
      description: Accepted only while registrationMode is manual
AgentModels:
  type: object
  description: Which models an agent may call and its default
  required:
  - access
  - defaultModelId
  properties:
    access:
      type: string
      enum:
      - all
      - selected
      description: all follows the team list
    modelIds:
      type: array
      items:
        type: string
    defaultModelId:
      type: string
    effectiveModelIds:
      type: array
      items:
        type: string
      readOnly: true
AgentModelsInput:
  type: object
  properties:
    access:
      type: string
      enum:
      - all
      - selected
    modelIds:
      type: array
      items:
        type: string
    defaultModelId:
      type: string
