# API contract v1.5.0 §4.13: model endpoints, routes and providers. Generated once from the contract, then hand-maintained.
ModelEndpointHealth:
  type: object
  description: Route health; Unknown before the first evaluation
  required:
  - state
  properties:
    state:
      type: string
      enum:
      - Ready
      - Degraded
      - Unavailable
      - Unknown
      description: Route condition derived by the reconciler from the gateway ledger over 5 minutes (PRD §10.4)
    reason:
      type:
      - string
      - 'null'
      description: Why the state is not Ready, for example error_rate or ttft_objective
    since:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
  readOnly: true
EndpointModelPriceInline:
  type: object
  description: USD per million tokens and an optional per-call fee; team endpoints set prices inline (PutTeamEndpointModels)
  required:
  - inputUsdPerMtok
  - outputUsdPerMtok
  properties:
    inputUsdPerMtok:
      $ref: '#/components/schemas/Money'
    outputUsdPerMtok:
      $ref: '#/components/schemas/Money'
    cachedInputUsdPerMtok:
      $ref: '#/components/schemas/Money'
    requestFeeUsd:
      $ref: '#/components/schemas/Money'
EndpointModel:
  type: object
  required:
  - modelName
  - maxOutputTokens
  - enabled
  properties:
    modelName:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^/\s][\x20-\x7e]*$
      description: What the client sends in model (for Azure, the deployment name)
    maxOutputTokens:
      type: integer
      minimum: 1
      maximum: 1000000
    contextTokens:
      type:
      - integer
      - 'null'
      minimum: 1
    enabled:
      type: boolean
    callable:
      type: boolean
      description: Enabled and, on a per_token route, priced in force
      readOnly: true
    priceState:
      type: string
      enum:
      - approved
      - pending
      - none
      - not_required
      description: not_required on capacity and free routes
      readOnly: true
    price:
      oneOf:
      - $ref: '#/components/schemas/EndpointModelPriceInline'
      - type: 'null'
      readOnly: true
      description: The price in force, if any
EndpointModelInput:
  type: object
  required:
  - modelName
  - maxOutputTokens
  properties:
    modelName:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[^/\s][\x20-\x7e]*$
    maxOutputTokens:
      type: integer
      minimum: 1
      maximum: 1000000
    contextTokens:
      type: integer
      minimum: 1
    enabled:
      type: boolean
      default: true
TeamEndpointModelInput:
  allOf:
  - $ref: '#/components/schemas/EndpointModelInput'
  - type: object
    description: price is required on a per_token team endpoint and refused on capacity and free ones
    properties:
      price:
        $ref: '#/components/schemas/EndpointModelPriceInline'
EndpointModelList:
  type: object
  description: The route models of an endpoint
  required:
  - endpointId
  - items
  properties:
    endpointId:
      type: string
      pattern: ^mep_[0-9A-HJKMNP-TV-Z]{26}$
    items:
      type: array
      items:
        $ref: '#/components/schemas/EndpointModel'
      maxItems: 500
    version:
      type: integer
      description: The endpoint's version after the change
      readOnly: true
PutEndpointModelsRequest:
  type: object
  description: Replaces the endpoint's route models; a model left out is removed
  required:
  - models
  properties:
    models:
      type: array
      items:
        $ref: '#/components/schemas/EndpointModelInput'
      maxItems: 500
PutTeamEndpointModelsRequest:
  type: object
  description: Replaces the team endpoint's route models and their prices (written as manual prices effective now)
  required:
  - models
  properties:
    models:
      type: array
      items:
        $ref: '#/components/schemas/TeamEndpointModelInput'
      maxItems: 500
ModelEndpoint:
  type: object
  description: One configured upstream (a route). Never holds a credential value
  required:
  - id
  - teamId
  - slug
  - displayName
  - provider
  - protocols
  - location
  - baseUrl
  - authKind
  - credentialMode
  - pricingMode
  - requiresTerms
  - enabled
  - providerState
  - version
  properties:
    id:
      type: string
      pattern: ^mep_[0-9A-HJKMNP-TV-Z]{26}$
      readOnly: true
    teamId:
      type:
      - string
      - 'null'
      pattern: ^team_[0-9A-HJKMNP-TV-Z]{26}$
      description: null for a service endpoint
      readOnly: true
    slug:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,30}$
      description: The route name; bedrock is reserved; immutable
    displayName: &id001
      type: string
      minLength: 1
      maxLength: 200
    description: &id002
      type: string
      maxLength: 2000
    protocols: &id003
      type: array
      items:
        type: string
        enum:
        - openai_chat
        - openai_responses
        - openai_embeddings
      minItems: 1
      uniqueItems: true
      description: openai_chat always; openai_responses and openai_embeddings add those paths
    baseUrl: &id004
      type: string
      maxLength: 500
      format: uri
      description: https for external and corporate; in_namespace may be http://<service>.<namespace>.svc:<port>
    caBundle: &id005
      type:
      - string
      - 'null'
      maxLength: 16384
      description: PEM; not a secret
    authKind: &id006
      type: string
      enum:
      - none
      - bearer
      - header
      - azure_federated
      - google_federated
    authHeader: &id007
      type:
      - string
      - 'null'
      maxLength: 100
      pattern: ^[A-Za-z0-9-]{1,100}$
      description: Header name, required when authKind is header
    pricingMode: &id008
      type: string
      enum:
      - per_token
      - capacity
      - free
    timeoutSeconds: &id009
      type: integer
      minimum: 5
      maximum: 3600
      default: 300
    maxBodyMib: &id010
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    owner:
      type:
      - string
      - 'null'
      maxLength: 200
      description: Required on team endpoints
    purpose:
      type:
      - string
      - 'null'
      maxLength: 500
      description: Required on team endpoints
    provider:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,30}$
      description: Provider key of inference_providers (bedrock, openai, openrouter, nous, opencode, azure, google, other)
        or internal for corporate and in-namespace endpoints, which have no provider switch
    location:
      type: string
      enum:
      - external
      - corporate
      - in_namespace
    metricsPort:
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 65535
      description: in_namespace only
    credentialMode:
      type: string
      enum:
      - shared
      - per_team
      description: Team endpoints are always per_team
    requiresTerms:
      type: boolean
      description: 'Extra terms: only a service admin selects it for a team'
    useProviderCost:
      type: boolean
      description: Settle to the larger of the provider's usage.cost and the token-price cost
    enabled:
      type: boolean
      description: The service (or team) switch; new endpoints are off
    externalSystemId:
      type:
      - string
      - 'null'
      pattern: ^ext_[0-9A-HJKMNP-TV-Z]{26}$
      description: The llm external system of the same provider (direct-access policy, MEG-OQ-5)
    builtin:
      type: boolean
      readOnly: true
    providerState:
      type: string
      enum:
      - 'on'
      - 'off'
      description: off when the provider's switch is off (provider policy)
      readOnly: true
    metered:
      type: boolean
      readOnly: true
    capped:
      type: boolean
      description: per_token routes reserve and settle against the team budget
      readOnly: true
    models:
      type: array
      items:
        $ref: '#/components/schemas/EndpointModel'
      readOnly: true
    teamsSelected:
      type: integer
      minimum: 0
      readOnly: true
    health:
      $ref: '#/components/schemas/ModelEndpointHealth'
    version:
      type: integer
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
    createdBy:
      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
      readOnly: true
ModelEndpointList:
  type: object
  description: A page of ModelEndpoint resources
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/ModelEndpoint'
    nextToken:
      type: string
      description: Absent on the last page
CreateModelEndpointRequest:
  type: object
  description: A service endpoint; created off (enabled false)
  required:
  - slug
  - displayName
  - provider
  - protocols
  - location
  - baseUrl
  - authKind
  - pricingMode
  properties:
    slug:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,30}$
    displayName: *id001
    description: *id002
    protocols: *id003
    baseUrl: *id004
    caBundle: *id005
    authKind: *id006
    authHeader: *id007
    pricingMode: *id008
    timeoutSeconds: *id009
    maxBodyMib: *id010
    provider:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,30}$
      description: Provider key of inference_providers (bedrock, openai, openrouter, nous, opencode, azure, google, other)
        or internal for corporate and in-namespace endpoints, which have no provider switch
    location:
      type: string
      enum:
      - external
      - corporate
    credentialMode:
      type: string
      enum:
      - shared
      - per_team
      default: per_team
    requiresTerms:
      type: boolean
      default: false
    useProviderCost:
      type: boolean
      default: false
    externalSystemId:
      type: string
      pattern: ^ext_[0-9A-HJKMNP-TV-Z]{26}$
    models:
      type: array
      items:
        $ref: '#/components/schemas/EndpointModelInput'
      maxItems: 500
UpdateModelEndpointRequest:
  type: object
  description: Members sent replace stored ones; slug cannot change
  properties:
    displayName:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 2000
    protocols:
      type: array
      items:
        type: string
        enum:
        - openai_chat
        - openai_responses
        - openai_embeddings
      minItems: 1
      uniqueItems: true
      description: openai_chat always; openai_responses and openai_embeddings add those paths
    baseUrl:
      type: string
      maxLength: 500
      format: uri
      description: https for external and corporate; in_namespace may be http://<service>.<namespace>.svc:<port>
    caBundle:
      type:
      - string
      - 'null'
      maxLength: 16384
      description: PEM; not a secret
    authKind:
      type: string
      enum:
      - none
      - bearer
      - header
      - azure_federated
      - google_federated
    authHeader:
      type:
      - string
      - 'null'
      maxLength: 100
      pattern: ^[A-Za-z0-9-]{1,100}$
      description: Header name, required when authKind is header
    pricingMode:
      type: string
      enum:
      - per_token
      - capacity
      - free
    timeoutSeconds:
      type: integer
      minimum: 5
      maximum: 3600
      default: 300
    maxBodyMib:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    provider:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,30}$
    location:
      type: string
      enum:
      - external
      - corporate
    credentialMode:
      type: string
      enum:
      - shared
      - per_team
    requiresTerms:
      type: boolean
    useProviderCost:
      type: boolean
    externalSystemId:
      type:
      - string
      - 'null'
      pattern: ^ext_[0-9A-HJKMNP-TV-Z]{26}$
    enabled:
      type: boolean
      description: Refused while the provider is off (provider_disabled) or the base URL holds a placeholder (endpoint_base_url_placeholder)
CreateTeamModelEndpointRequest:
  type: object
  description: A team-declared endpoint (needs mayAddModelEndpoints). The provider is derived from the host; a host of a disabled
    provider is refused (provider_disabled). Created off
  required:
  - slug
  - displayName
  - owner
  - purpose
  - protocols
  - location
  - baseUrl
  - authKind
  - pricingMode
  properties:
    slug:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,30}$
      description: Unique in the team and not a service slug
    displayName: *id001
    description: *id002
    protocols: *id003
    baseUrl: *id004
    caBundle: *id005
    authKind: *id006
    authHeader: *id007
    pricingMode: *id008
    timeoutSeconds: *id009
    maxBodyMib: *id010
    owner:
      type: string
      minLength: 1
      maxLength: 200
    purpose:
      type: string
      minLength: 1
      maxLength: 500
    location:
      type: string
      enum:
      - external
      - corporate
      - in_namespace
    metricsPort:
      type: integer
      minimum: 1
      maximum: 65535
    models:
      type: array
      items:
        $ref: '#/components/schemas/TeamEndpointModelInput'
      maxItems: 500
UpdateTeamModelEndpointRequest:
  type: object
  description: Members sent replace stored ones; slug cannot change
