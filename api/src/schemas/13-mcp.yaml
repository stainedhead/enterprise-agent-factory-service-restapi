    owner:
      type: string
      maxLength: 200
    purpose:
      type: string
      maxLength: 1000
    docUrl:
      type: string
      pattern: ^https://
      maxLength: 500
    dataClassification:
      type: string
      enum:
      - public
      - internal
      - confidential
      - restricted
    transport:
      type: string
      enum:
      - streamable_http
      - hosted
    location:
      type: string
      enum:
      - external
      - corporate
      - in_namespace
    url:
      type: string
      pattern: ^https://
      maxLength: 500
    caBundle:
      type: string
      maxLength: 16384
      description: PEM certificates for a corporate host
    hosted:
      $ref: '#/components/schemas/McpHostedSpec'
    authKind:
      type: string
      enum:
      - none
      - static
      - oauth_client
      - workload_federation
      - oauth_user
      - aws_sigv4
    authHeader:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9-]{0,63}$
    federation:
      $ref: '#/components/schemas/McpFederation'
    limits:
      $ref: '#/components/schemas/McpLimits'
    credentialMode:
      type: string
      enum:
      - shared
      - per_team
    driftPolicy:
      type: string
      enum:
      - hold
      - auto_approve_compatible
    allowSampling:
      type: boolean
    trustAnnotations:
      type: boolean
  additionalProperties: false
