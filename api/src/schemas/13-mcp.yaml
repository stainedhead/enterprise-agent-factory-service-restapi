# API contract v1.6.0 §4.14: governed MCP servers and federated identities. Generated once from the contract, then hand-maintained.
McpLimits:
  type: object
  description: Per-server limits; members left out take mcp.limits
  properties:
    requestBytes:
      type: integer
      minimum: 1024
      maximum: 16777216
    responseBytes:
      type: integer
      minimum: 1024
      maximum: 67108864
    timeoutSeconds:
      type: integer
      minimum: 1
      maximum: 600
    concurrentPerAgent:
      type: integer
      minimum: 1
      maximum: 64
McpFederation:
  type: object
  description: workload_federation only (PRD §9)
  required:
  - issuer
  - audience
  - tokenEndpoint
  properties:
    issuer:
      type: string
      description: The issuer the upstream trusts (the cluster OIDC issuer or the IdP)
      maxLength: 500
    audience:
      type: string
      maxLength: 300
    subjectTemplate:
      type: string
      description: For example system:serviceaccount:afs-t-{teamSlug}:afs-gateway
      maxLength: 300
    tokenEndpoint:
      type: string
      pattern: ^https://
      maxLength: 500
McpHostedSpec:
  type: object
  description: A server AFS runs in the team namespace behind afs-mcp-bridge (PRD §10.2)
  required:
  - imageDigest
  properties:
    imageDigest:
      type: string
      pattern: ^[^@\s]+@sha256:[0-9a-f]{64}$
      description: Pinned by digest (400 image_not_pinned); the registry must be in mcp.allowed_image_registries
    args:
      type: array
      items:
        type: string
        maxLength: 1000
      maxItems: 64
    envNames:
      type: array
      items:
        type: string
        pattern: ^[A-Z_][A-Z0-9_]{0,63}$
      maxItems: 64
      description: Names only; values are secret references delivered to the pod
    instanceMode:
      type: string
      enum:
      - per_team
      - per_agent
    egressHosts:
      type: array
      items:
        type: string
        maxLength: 253
      maxItems: 50
    resources:
      type: object
      properties:
        cpu:
          type: string
        memory:
          type: string
    needsAws:
      type: boolean
      default: false
McpCheck:
  type: object
  required:
  - name
  - outcome
  - checkedAt
  properties:
    name:
      type: string
      description: reachability, tls, protocol_version, host_policy, inventory, description_injection, image_signature, image_digest,
        image_scan
    outcome:
      type: string
      enum:
      - pass
      - warn
      - fail
    detail:
      type:
      - string
      - 'null'
      maxLength: 500
    checkedAt:
      $ref: '#/components/schemas/Timestamp'
McpAdoption:
  type: object
  required:
  - teams
  - agents
  properties:
    teams:
      type: integer
      minimum: 0
    agents:
      type: integer
      minimum: 0
  readOnly: true
McpServer:
  type: object
  description: An MCP server of the catalog. Never holds a credential value (credentialState only)
  required:
  - id
  - teamId
  - scope
  - slug
  - displayName
  - dataClassification
  - transport
  - location
  - authKind
  - reviewStatus
  - published
  - driftPolicy
  - credentialState
  - version
  - createdAt
  - createdBy
  - updatedAt
  properties:
    id:
      type: string
      pattern: ^mcp_[0-9A-HJKMNP-TV-Z]{26}$
      readOnly: true
    teamId:
      type:
      - string
      - 'null'
      pattern: ^team_[0-9A-HJKMNP-TV-Z]{26}$
      description: null for an enterprise server
    scope:
      type: string
      enum:
      - enterprise
      - team
    slug:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,30}$
      description: The route /mcp/<slug> and the prefix of its tool names; afs is reserved
    displayName:
      type: string
      minLength: 1
      maxLength: 100
    owner:
      type: string
      maxLength: 200
    purpose:
      type: string
      maxLength: 1000
    docUrl:
      type:
      - string
      - 'null'
      pattern: ^https://
      maxLength: 500
    dataClassification:
      type: string
      enum:
      - public
      - internal
      - confidential
      - restricted
    transport:
      type: string
      enum:
      - streamable_http
      - hosted
    location:
      type: string
      enum:
      - external
      - corporate
      - in_namespace
    url:
      type:
      - string
      - 'null'
      pattern: ^https://
      maxLength: 500
    hosted:
      oneOf:
      - $ref: '#/components/schemas/McpHostedSpec'
      - type: 'null'
    authKind:
      type: string
      enum:
      - none
      - static
      - oauth_client
      - workload_federation
      - oauth_user
      - aws_sigv4
    authHeader:
      type:
      - string
      - 'null'
      pattern: ^[A-Za-z][A-Za-z0-9-]{0,63}$
    credentialMode:
      type: string
      enum:
      - shared
      - per_team
    federation:
      oneOf:
      - $ref: '#/components/schemas/McpFederation'
      - type: 'null'
    protocolVersion:
      type:
      - string
      - 'null'
      maxLength: 20
      readOnly: true
    reviewStatus:
      type: string
      enum:
      - draft
      - pending_review
      - approved
      - rejected
      - suspended
    published:
      type: boolean
    riskTier:
      type:
      - string
      - 'null'
      enum:
      - low
      - elevated
      - high
      - null
      readOnly: true
    riskReasons:
      type: array
      items:
        type: string
      readOnly: true
    approver:
      type:
      - string
      - 'null'
      enum:
      - team_admin
      - security
      - null
      readOnly: true
      description: Who decides the pending review, from mcp.team_server_approval
    checks:
      type: array
      items:
        $ref: '#/components/schemas/McpCheck'
      readOnly: true
    driftPolicy:
      type: string
      enum:
      - hold
      - auto_approve_compatible
    defaultForNewTeams:
      type: boolean
    allowSampling:
      type: boolean
    trustAnnotations:
      type: boolean
    limits:
      $ref: '#/components/schemas/McpLimits'
    credentialState:
      type: string
      enum:
      - set
      - missing
      - expired
      - not_required
    suspendedReason:
      type:
      - string
      - 'null'
      maxLength: 500
      readOnly: true
    adoption:
      $ref: '#/components/schemas/McpAdoption'
    version:
      type: integer
      readOnly: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
    createdBy:
      type: string
      readOnly: true
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
McpServerList:
  type: object
  required:
  - items
  properties:
    items:
      type: array
      items:
        $ref: '#/components/schemas/McpServer'
    nextToken:
      type:
      - string
      - 'null'
      maxLength: 2048
