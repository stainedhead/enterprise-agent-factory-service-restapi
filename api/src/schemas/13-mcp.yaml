      - hosted
    location:
      type: string
      enum:
      - external
      - corporate
      - in_namespace
    url:
      type: string
      pattern: ^https://
      maxLength: 500
    caBundle:
      type: string
      maxLength: 16384
      description: PEM certificates for a corporate host
    hosted:
      $ref: '#/components/schemas/McpHostedSpec'
    authKind:
      type: string
