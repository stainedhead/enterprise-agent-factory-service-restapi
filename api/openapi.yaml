openapi: 3.1.0
info:
  title: Agent Factory Service API
  version: 0.0.1
  description: >
    Control plane API for the Agent Factory Service. Role-based access is enforced on every
    operation. Design: agent-factory docs/solution-design.md section 10.
servers:
  - url: https://afs.example.internal
security:
  - oidc: []
paths:
  /healthz:
    get:
      operationId: GetHealth
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /readyz:
    get:
      operationId: GetReadiness
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: A dependency is not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.example.internal/.well-known/openid-configuration
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [ValidationError, NotFound, Conflict, PreconditionFailed, AccessDenied, Unauthenticated, BudgetExceeded, Throttled, InternalError]
        message: { type: string }
        requestId: { type: string }
