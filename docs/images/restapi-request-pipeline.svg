<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="afs-api request pipeline"><title>afs-api request pipeline</title><defs><marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0972d3"/></marker><marker id="arrow-client-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0972d3"/></marker><marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec7211"/></marker><marker id="arrow-api-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ec7211"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8102"/></marker><marker id="arrow-data-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1d8102"/></marker><marker id="arrow-aws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d3cff"/></marker><marker id="arrow-aws-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7d3cff"/></marker><marker id="arrow-k8s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#326ce5"/></marker><marker id="arrow-k8s-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#326ce5"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="arrow-neutral-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="arrow-danger-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d13212"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="arrow-dark-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#232f3e"/></marker></defs><rect width="1400" height="520" fill="#ffffff"/><rect x="0" y="0" width="1400" height="6" fill="#ff9900"/><text x="32" y="44" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#16191f">afs-api request pipeline</text><text x="32" y="68" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6b7a">Every /v1 route declares a permission. A mutation commits its row, audit record and outbox event together, or nothing.</text><g><rect x="30" y="260" width="1340" height="170" rx="14" fill="#fff6e8" fill-opacity="0.55" stroke="#ec7211" stroke-width="1.4" /><text x="46" y="284" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ec7211" letter-spacing="0.6">USE CASE: ONE DATABASE TRANSACTION AS AFS_APP</text></g><polyline points="225,166 255,166" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="450,166 480,166" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="675,166 705,166" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="900,166 930,166" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="1125,166 1155,166" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="245,356 267,356" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="467,356 489,356" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="689,356 711,356" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="911,356 933,356" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="1133,356 1155,356" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="1252.5,212 1252,240 16,240 16,356 45,356" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><g><rect x="30" y="120" width="195" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="30" y="120" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="127.5" y="162.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Metrics</text><text x="127.5" y="181.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">RED per route</text></g><g><rect x="255" y="120" width="195" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="255" y="120" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="352.5" y="154" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Authenticate</text><text x="352.5" y="173" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">OIDC JWT, API key</text><text x="352.5" y="190" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">or workload token</text></g><g><rect x="480" y="120" width="195" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="480" y="120" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="577.5" y="162.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Rate limit</text><text x="577.5" y="181.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">+ CORS</text></g><g><rect x="705" y="120" width="195" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="705" y="120" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="802.5" y="162.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">If-Match</text><text x="802.5" y="181.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">required on updates</text></g><g><rect x="930" y="120" width="195" height="92" rx="10" fill="#fdeeec" stroke="#d13212" stroke-width="1.6"/><rect x="930" y="120" width="5" height="92" rx="2" fill="#d13212" opacity="0.9"/><text x="1027.5" y="154" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6b1104">Authorize</text><text x="1027.5" y="173" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">route permission</text><text x="1027.5" y="190" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">+ teamId from path</text></g><g><rect x="1155" y="120" width="195" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="1155" y="120" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="1252.5" y="162.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Suspended guard</text><text x="1252.5" y="181.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">team state</text></g><g><rect x="45" y="310" width="200" height="92" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="45" y="310" width="5" height="92" rx="2" fill="#ec7211" opacity="0.9"/><text x="145" y="344" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">SET LOCAL</text><text x="145" y="363" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">actor, team_ids,</text><text x="145" y="380" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">service_admin</text></g><g><rect x="267" y="310" width="200" height="92" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="267" y="310" width="5" height="92" rx="2" fill="#ec7211" opacity="0.9"/><text x="367" y="352.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">Claim Idempotency-Key</text><text x="367" y="371.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">HMAC fingerprint</text></g><g><rect x="489" y="310" width="200" height="92" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="489" y="310" width="5" height="92" rx="2" fill="#ec7211" opacity="0.9"/><text x="589" y="344" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">Write row</text><text x="589" y="363" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">version check → 412</text><text x="589" y="380" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">on mismatch</text></g><g><rect x="711" y="310" width="200" height="92" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="711" y="310" width="5" height="92" rx="2" fill="#ec7211" opacity="0.9"/><text x="811" y="352.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">audit_log</text><text x="811" y="371.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">who, what, request id</text></g><g><rect x="933" y="310" width="200" height="92" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="933" y="310" width="5" height="92" rx="2" fill="#ec7211" opacity="0.9"/><text x="1033" y="344" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">outbox_events</text><text x="1033" y="363" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">when the contract</text><text x="1033" y="380" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">names an event</text></g><g><rect x="1155" y="310" width="200" height="92" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="1155" y="310" width="5" height="92" rx="2" fill="#ec7211" opacity="0.9"/><text x="1255" y="352.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">Store response, COMMIT</text><text x="1255" y="371.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">replay-safe</text></g><text x="30" y="470" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">Denied requests are audited too. Errors are {code, message, requestId}; secrets and Authorization headers are redacted from logs.</text><text x="30" y="487.5" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">afs-api calls AWS only to write secret values (Secrets Manager) and never calls Kubernetes.</text><text x="1376" y="506" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8d99a8">Enterprise Agent Factory Service · restapi-request-pipeline</text></svg>
