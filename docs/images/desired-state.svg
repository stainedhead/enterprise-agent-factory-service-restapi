l="#414d5c">agent.updated …</text></g><g><rect x="30" y="480" width="200" height="82" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="30" y="480" width="5" height="82" rx="2" fill="#0972d3" opacity="0.9"/><text x="130" y="509" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">--wait / waitFor</text><text x="130" y="528" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">CLI and SDK poll status</text><text x="130" y="545" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">console shows dot + word</text></g><text x="30" y="652" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">Optimistic concurrency: a stale If-Match gets 412 PreconditionFailed. A restored database plus a new cluster converge with no manual steps.</text><text x="1376" y="666" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8d99a8">Enterprise Agent Factory Service · desired-state</text></svg>
