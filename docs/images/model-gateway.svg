10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="487" y="96" width="5" height="62" rx="2" fill="#1d8102" opacity="0.9"/><text x="585" y="123.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">PostgreSQL</text><text x="585" y="142.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">routes, spend, ledger</text></g><g><rect x="709" y="96" width="196" height="62" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="709" y="96" width="5" height="62" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="807" y="123.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">Route upstream</text><text x="807" y="142.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">provider or internal</text></g><g><rect x="931" y="96" width="196" height="62" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="931" y="96" width="5" height="62" rx="2" fill="#ec7211" opacity="0.9"/><text x="1029" y="123.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-reconciler</text><text x="1029" y="142.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">leader</text></g><g><rect x="1153" y="96" width="196" height="62" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="1153" y="96" width="5" height="62" rx="2" fill="#ec7211" opacity="0.9"/><text x="1251" y="123.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-billing</text><text x="1251" y="142.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">CronJobs</text></g><rect x="49" y="188" width="1072" height="46" rx="6" fill="#edf2fe" stroke="#326ce5" stroke-width="1.1"/><text x="585" y="207" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#102a6b">per_namespace team: the reconciler renders the team gateway, route-host egress</text><text x="585" y="223" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#102a6b">from the gateway only, and AFS_LLM_*, OPENAI_BASE_URL, /etc/afs/llm-routes.json for agents</text><text x="252" y="263" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">POST /r/&lt;route&gt;/v1/chat/completions</text><circle cx="119" cy="270" r="11" fill="#326ce5"/><text x="119" y="274.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text><text x="413" y="330" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">caller = source pod IP; or /openai/v1 with model &lt;route&gt;/&lt;model&gt;</text><circle cx="341" cy="314" r="11" fill="#ec7211"/><text x="341" y="318.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text><text x="474" y="365" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">route_admission (cached 60 s, change feed)</text><circle cx="341" cy="372" r="11" fill="#ec7211"/><text x="341" y="376.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text><text x="252" y="435" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">403 provider_disabled · route_not_enabled_* · model_not_priced</text><circle cx="385" cy="442" r="11" fill="#d13212"/><text x="385" y="446.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text><text x="474" y="493" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">reserve_spend_held(output cap × route price)</text><circle cx="341" cy="500" r="11" fill="#ec7211"/><text x="341" y="504.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">5</text><text x="252" y="563" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">402 BudgetExceeded (no retry)</text><circle cx="385" cy="570" r="11" fill="#d13212"/><text x="385" y="574.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text><text x="585" y="621" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">forward: route key or federated token, cap written in</text><circle cx="341" cy="628" r="11" fill="#ec7211"/><text x="341" y="632.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text><text x="585" y="665" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">response + usage (SSE, include_usage)</text><circle cx="829" cy="672" r="11" fill="#5f6b7a"/><text x="829" y="676.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">8</text><text x="474" y="709" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">settle(tokens × price, or usage.cost if larger) + usage row</text><circle cx="341" cy="716" r="11" fill="#ec7211"/><text x="341" y="720.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">9</text><text x="252" y="753" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">response (stream passes through)</text><circle cx="385" cy="760" r="11" fill="#ec7211"/><text x="385" y="764.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">10</text><rect x="271" y="786" width="628" height="46" rx="6" fill="#eef8ee" stroke="#1d8102" stroke-width="1.1"/><text x="585" y="805" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#0b3d00">upstream 429 → 429 · 5xx → 502 · timeout → 504 · no credential → 503: reservation released</text><text x="585" y="821" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#0b3d00">Bedrock route /r/bedrock: Chat Completions → Converse on the team inference profile</tex