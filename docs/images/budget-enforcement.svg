ont-weight="700" fill="#5c2c00">afs-billing</text><text x="1251" y="142.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">daily job</text></g><text x="252" y="199" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">POST /model/{id}/converse</text><circle cx="119" cy="206" r="11" fill="#326ce5"/><text x="119" y="210.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text><text x="413" y="266" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">caller = source pod IP → team, agent</text><circle cx="341" cy="250" r="11" fill="#ec7211"/><text x="341" y="254.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text><text x="474" y="301" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">reserve_spend_held(worst case)</text><circle cx="341" cy="308" r="11" fill="#ec7211"/><text x="341" y="312.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text><text x="474" y="371" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">NULL</text><circle cx="607" cy="378" r="11" fill="#d13212"/><text x="607" y="382.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text><text x="252" y="415" text-anchor="middle" font-family="-apple-system,