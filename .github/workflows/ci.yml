name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests (store adapters, migrations) skip when this is unset.
      AFS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/afs_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The root repository holds the API contract that api/contract/*.json is extracted from.
      - uses: actions/checkout@v5
        with:
          repository: stainedhead/enterprise-agent-factory-service
          ref: main
          path: .afs-root
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: tagged suites compile (e2e, load, conformance, envtest)
        run: make vet-tags
      - name: OpenAPI bundle has no drift
        run: make openapi-check
      - name: contract extract has no drift
        run: make contract-check AFS_ROOT_DIR=.afs-root
      - name: golangci-lint
        # Built from source with the go.mod toolchain so it can analyze Go 1.27 code.
        run: make lint GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
      - name: go test (race)
        run: go test -race ./...
      - name: coverage (domain, usecase, authz at 90% or more)
        run: make cover
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  envtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: envtest assets (kube-apiserver and etcd)
        run: |
          go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.3 use 1.37.x --bin-dir "$RUNNER_TEMP/envtest" -p path > "$RUNNER_TEMP/envtest.path"
          echo "KUBEBUILDER_ASSETS=$(cat "$RUNNER_TEMP/envtest.path")" >> "$GITHUB_ENV"
      - name: envtest suites
        run: make envtest

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
